function escapeHtml(s){
  return s.replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);
}

/* --------- TAB: PROGRESO --------- */
function renderProgreso(){
  // 4 weeks bar chart
  const weeks = [];
  for(let i=3;i>=0;i--){
    const monday = new Date();
    const dow = monday.getDay() || 7;
    monday.setDate(monday.getDate() - (dow-1) - i*7);
    const iso = isoOf(monday);
    weeks.push({ iso, dist: weekDistance(iso), label: 'S-'+i });
  }
  weeks[3].label = 'Esta sem';
  const maxDist = Math.max(...weeks.map(w=>w.dist), 1000);

  let bars = '';
  weeks.forEach(w=>{
    const h = w.dist === 0 ? 3 : Math.max(3, (w.dist/maxDist)*100);
    bars += `<div class="chart-col">
      <div class="chart-bar ${w.dist===0?'zero':''}" style="height:${h}%;"></div>
      <div class="chart-label">${w.label}</div>
    </div>`;
  });

  const td = todayISO();
  const week = weekNumber(td);
  const phase = phaseFor(week);
  const total = totalDistance();
  const sessions = sessionsCompleted();
  const phaseObj = PLAN.phases.find(p=>p.weeks.includes(week)) || PLAN.phases[PLAN.phases.length-1];
  const phaseProgress = ((week - phaseObj.weeks[0]) / phaseObj.weeks.length) * 100;

  // === Progress rings data ===
  // Outer ring: today's session blocks completion (% of blocks done)
  const todayLog = state.logs[td] || {};
  const todaySessionInfo = getSessionForDate(td);
  const todaySession = todaySessionInfo.session;
  const todayBlocksDone = (todayLog.blocksDone || []).length;
  const todayBlocksTotal = todaySession ? todaySession.blocks.length : 0;
  const ringTodayPct = todaySession
    ? (todayLog.done ? 100 : (todayBlocksTotal > 0 ? (todayBlocksDone / todayBlocksTotal) * 100 : 0))
    : (todaySessionInfo.isRest ? 100 : 0);

  // Middle ring: this week's sessions completed (out of planned)
  const monIso = getMondayOf(td);
  let weekDone = 0, weekPlanned = 0;
  for(let i = 0; i < 7; i++){
    const dd = new Date(parseISO(monIso)); dd.setDate(dd.getDate()+i);
    const ddIso = isoOf(dd);
    const info = getSessionForDate(ddIso);
    if(info.session){
      weekPlanned++;
      const log = state.logs[ddIso];
      if(log && log.done) weekDone++;
    }
  }
  const ringWeekPct = weekPlanned > 0 ? (weekDone / weekPlanned) * 100 : 0;

  // Inner ring: phase progress
  const ringPhasePct = Math.min(100, Math.max(0, phaseProgress));

  // Build SVG rings (3 concentric)
  const ringsSVG = buildProgressRings({
    today: ringTodayPct,
    week: ringWeekPct,
    phase: ringPhasePct
  });

  let html = `<section class="section">
    <div class="rings-card">
      <div class="rings-svg-wrap">${ringsSVG}</div>
      <div class="rings-legend">
        <div class="ring-legend-item">
          <span class="ring-dot" style="background:var(--coral);"></span>
          <span class="ring-label">Hoy</span>
          <span class="ring-val">${Math.round(ringTodayPct)}%</span>
        </div>
        <div class="ring-legend-item">
          <span class="ring-dot" style="background:var(--gold);"></span>
          <span class="ring-label">Semana</span>
          <span class="ring-val">${weekDone}/${weekPlanned}</span>

/**
 * Animates all elements with [data-animate-num] from 0 to their final value.
 */
function animateNumbers(){
  const els = document.querySelectorAll('[data-animate-num]');
  els.forEach(el => {
    const finalText = el.dataset.animateNum;
    const finalNum = parseFloat(finalText);
    if(isNaN(finalNum)) return;
    const isDecimal = finalText.includes('.');
    const decimals = isDecimal ? (finalText.split('.')[1] || '').length : 0;
    const duration = 900; // ms
    const start = performance.now();
    el.textContent = isDecimal ? '0.0' : '0';
    function step(now){
      const elapsed = now - start;
      const t = Math.min(1, elapsed / duration);
      // Ease-out cubic
      const eased = 1 - Math.pow(1 - t, 3);
      const current = finalNum * eased;
      el.textContent = current.toFixed(decimals);
      if(t < 1) requestAnimationFrame(step);
      else el.textContent = finalText; // exact final value
    }
    requestAnimationFrame(step);
  });
}

/**
 * Builds 3-concentric ring SVG (Apple Fitness inspired but with our palette).
 * Outer = coral (today), Middle = gold (week), Inner = tide (phase).
 */
function buildProgressRings({ today, week, phase }){
  // Sizes: outer ring r=88, middle r=68, inner r=48 (stroke-width=14, gap=2)
  const cx = 110, cy = 110;
  const stroke = 14;
  const r1 = 88, r2 = 68, r3 = 48;
  const c1 = 2 * Math.PI * r1;
  const c2 = 2 * Math.PI * r2;
  const c3 = 2 * Math.PI * r3;

  return `
    <svg class="rings-svg" viewBox="0 0 220 220" width="220" height="220">
      <defs>
        <linearGradient id="ringCoral" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#ff8a6b"/>
          <stop offset="100%" stop-color="#e87559"/>
        </linearGradient>
        <linearGradient id="ringGold" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#e8c068"/>
          <stop offset="100%" stop-color="#d4a74a"/>
        </linearGradient>
        <linearGradient id="ringTide" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#5fa4b5"/>
          <stop offset="100%" stop-color="#0e5b6f"/>
        </linearGradient>
      </defs>

      <!-- Background tracks -->
      <circle cx="${cx}" cy="${cy}" r="${r1}" fill="none" stroke="var(--line-soft)" stroke-width="${stroke}"/>
      <circle cx="${cx}" cy="${cy}" r="${r2}" fill="none" stroke="var(--line-soft)" stroke-width="${stroke}"/>
      <circle cx="${cx}" cy="${cy}" r="${r3}" fill="none" stroke="var(--line-soft)" stroke-width="${stroke}"/>

      <!-- Progress rings (start at 0, animated to target via JS) -->
      <circle class="ring-progress" cx="${cx}" cy="${cy}" r="${r1}" fill="none" stroke="url(#ringCoral)" stroke-width="${stroke}" stroke-linecap="round"
              transform="rotate(-90 ${cx} ${cy})"
              stroke-dasharray="${c1.toFixed(2)}" stroke-dashoffset="${c1.toFixed(2)}"
              data-target="${today.toFixed(1)}" data-circumference="${c1.toFixed(2)}"/>
      <circle class="ring-progress" cx="${cx}" cy="${cy}" r="${r2}" fill="none" stroke="url(#ringGold)" stroke-width="${stroke}" stroke-linecap="round"
              transform="rotate(-90 ${cx} ${cy})"
              stroke-dasharray="${c2.toFixed(2)}" stroke-dashoffset="${c2.toFixed(2)}"
              data-target="${week.toFixed(1)}" data-circumference="${c2.toFixed(2)}"/>
      <circle class="ring-progress" cx="${cx}" cy="${cy}" r="${r3}" fill="none" stroke="url(#ringTide)" stroke-width="${stroke}" stroke-linecap="round"
              transform="rotate(-90 ${cx} ${cy})"
              stroke-dasharray="${c3.toFixed(2)}" stroke-dashoffset="${c3.toFixed(2)}"
              data-target="${phase.toFixed(1)}" data-circumference="${c3.toFixed(2)}"/>
    </svg>
  `;
}
function nextMilestone(total){
  const mil = [5000,10000,25000,50000,100000];
  for(const m of mil){
    if(total < m) return `${m/1000} km`;
  }
  return `${Math.ceil(total/100000)*100} km`;
}

async function toggleDry(idx, itemEl){
  const todayIso = todayISO();
  if(!state.logs[todayIso]) state.logs[todayIso] = {};

  const arr = state.logs[todayIso].dryDone;

/* --------- TEST 400 m STORAGE --------- */
let cachedTests = null;
function loadTests(){
  if(cachedTests) return cachedTests;
  try{
    const raw = localStorage.getItem('brazada_tests400');
    cachedTests = raw ? JSON.parse(raw) : [];
  }catch(e){ cachedTests = []; }
  return cachedTests;
}
function saveTests(arr){
  cachedTests = arr;
  try{ localStorage.setItem('brazada_tests400', JSON.stringify(arr)); }catch(e){}
}

/* --------- TAB: CRONÓMETRO (Test 400 m) --------- */
function renderCronometro(){
  const tests = loadTests();
  const sortedAsc = [...tests].sort((a,b)=>a.date.localeCompare(b.date));
  const best = tests.length ? Math.min(...tests.map(t=>t.timeMs)) : null;
  const last = tests.length ? sortedAsc[sortedAsc.length-1] : null;
  const first = tests.length ? sortedAsc[0] : null;
  const improvement = (best && first && best < first.timeMs) ? (first.timeMs - best) : 0;

  const fmt = formatTime;

  let chartHTML = '';
  if(sortedAsc.length >= 2){
    const maxT = Math.max(...sortedAsc.map(t=>t.timeMs));
    const minT = Math.min(...sortedAsc.map(t=>t.timeMs));
    const range = Math.max(1, maxT - minT);
    let bars = '';
    sortedAsc.slice(-6).forEach((t, i)=>{
      const h = 20 + ((maxT - t.timeMs) / range) * 80;
      const isBest = t.timeMs === minT;
      bars += `<div class="chart-col">
        <div class="chart-bar" style="height:${h}%;background:${isBest?'linear-gradient(180deg, var(--coral), #d56549)':'linear-gradient(180deg, var(--tide), var(--water))'};"></div>
        <div class="chart-label">${fmtDateShort(t.date).slice(0,5)}</div>
      </div>`;
    });
    chartHTML = `<div class="chart">
      <div class="chart-title">Evolución (últimos ${Math.min(6, sortedAsc.length)})</div>
      <div class="chart-bars">${bars}</div>
    </div>`;
  }

  let html = `<section class="section">
    <div class="timer-card">
      <div style="font-size:11px;letter-spacing:0.18em;text-transform:uppercase;font-weight:600;color:var(--foam);opacity:0.85;">

      <div class="timer-display" id="timerDisplay">${fmt(state.timer.ms)}</div>
      <div class="timer-btns">
        <button class="timer-btn" id="btnStart">${state.timer.running?'Pausa':'Iniciar'}</button>
        <button class="timer-btn" id="btnReset">Reset</button>
        <button class="timer-btn" id="btnSaveTime" ${!state.timer.ms?'disabled style="opacity:0.4;"':''}>Guardar</button>
      </div>

      <button class="btn btn-secondary" id="btnManualTime" style="font-size:12px;padding:8px 14px;">+ Añadir tiempo manualmente</button>
    </div>
  </section>`;

  if(tests.length === 0){
    html += `<section class="section">
      <div class="stat-card" style="text-align:center;padding:30px 20px;">
        <div class="stat-label" style="margin-bottom:10px;">¿Por qué este test?</div>

          Nadar <strong>400 m a crol cómodo</strong> es el indicador clásico de progreso en natación. Mide tu fondo aeróbico real.
        </p>
        <p style="font-size:13.5px;line-height:1.55;color:var(--ink);text-align:left;margin-top:10px;">
          <strong>Cómo:</strong> calienta 100-200 m, descansa 1 min, y nada 400 m sin parar a un ritmo que puedas mantener. No es un sprint.
        </p>
        <p style="font-size:12px;margin-top:14px;color:var(--muted);font-style:italic;">
          Hazlo cada 3-4 semanas (al final de cada fase) y ve viendo bajar el tiempo.
        </p>
      </div>
    </section>`;
  } else {
    html += `<section class="section">
      <h3 class="section-title">Tus tiempos</h3>
      <div class="stat-grid">
        <div class="stat-card flame">
          <div class="stat-label">Mejor marca</div>
          <div class="stat-value" style="font-size:30px;">${fmt(best)}</div>
          <div class="stat-sub">${tests.length} test${tests.length>1?'s':''} registrado${tests.length>1?'s':''}</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Última</div>
          <div class="stat-value" style="font-size:24px;">${fmt(last.timeMs)}</div>
          <div class="stat-sub">${fmtDateShort(last.date)}</div>
        </div>
        ${improvement > 0 ? `<div class="stat-card featured">
          <div class="stat-label">Mejora total</div>
          <div class="stat-value" style="color:var(--coral);">−${fmt(improvement)}</div>
          <div class="stat-sub">desde tu primer test</div>
        </div>` : ''}
      </div>
    </section>

    ${chartHTML ? `<section class="section">${chartHTML}</section>` : ''}

    <section class="section">
      <h3 class="section-title">Historial</h3>
      <div class="log-list">
        ${[...tests].sort((a,b)=>b.date.localeCompare(a.date)).map(t=>`

  $content.innerHTML = html;

  // Wire up timer
  document.getElementById('btnStart').addEventListener('click', ()=>{
    if(state.timer.running){
      state.timer.running = false;
      state.timer.ms += Date.now() - state.timer.started;

    state.timer.started = null;
    toast('¡Test guardado! 🏊');
    renderCronometro();
  });
  document.getElementById('btnManualTime').addEventListener('click', openManualModal);
}

function startTimerLoop(){
  if(!state.timer.running) return;
  const display = document.getElementById('timerDisplay');
  if(display){
    const total = state.timer.ms + (Date.now() - state.timer.started);
    display.textContent = formatTime(total);
  }
  requestAnimationFrame(startTimerLoop);
}

function formatTime(ms){
  if(!ms) return '00:00.0';
  const totalSec = ms/1000;
  const m = Math.floor(totalSec/60);
  const s = Math.floor(totalSec%60);
  const t = Math.floor((totalSec*10)%10);
  return pad(m)+':'+pad(s)+'.'+t;
}

/**
 * Updates pulsing dots on tabs to indicate pending tasks.
 * Hoy: dot if today's session has unfinished blocks (or not completed at all).
 * En seco: dot if today's dry routine has unfinished exercises.
 */
function updateTabDots(){
  const todayIso = todayISO();
  const log = state.logs[todayIso] || {};

  // ---- Hoy tab ----
  const todayInfo = getSessionForDate(todayIso);
  const todaySession = todayInfo.session;
  let hoyHasPending = false;
  if(todaySession && !log.done && !log.skipped){
    const blocksDone = (log.blocksDone || []).length;
    if(blocksDone < todaySession.blocks.length){
      hoyHasPending = true;
    }
  }
  const hoyTab = document.querySelector('.tab[data-tab="hoy"]');
  if(hoyTab){
    hoyTab.innerHTML = 'Hoy' + (hoyHasPending ? '<span class="dot"></span>' : '');
  }

  // ---- En seco tab ----
  const dow = dayOfWeekMonFirst(new Date());
  const dryRoutine = PLAN.dryExercises[dow];
  const dryDone = (log.dryDone || []).length;
  const secoHasPending = dryRoutine && dryDone < dryRoutine.exercises.length;
  const secoTab = document.querySelector('.tab[data-tab="seco"]');
  if(secoTab){
    secoTab.innerHTML = 'En seco' + (secoHasPending ? '<span class="dot"></span>' : '');
  }
}

/** Quotes specifically for rest days (positive, calm, validating). */
const REST_DAY_QUOTES = [
  "Hoy descansas. Y eso también es entrenar.",
  "El cuerpo se construye en la pausa. Disfrútala.",
  "Hoy tu trabajo es no trabajar. Bien hecho.",
  "Un día sin nadar no es un día perdido. Es un día de regalo a tus hombros.",
  "La pausa es parte del plan. No la culpes.",
  "Recuperarse también es progresar.",
  "Hoy no tienes nada que demostrar.",
];

/**
 * Stable hash of an ISO date string → integer.
 * Used to pick the same quote all day but a different one each day.
 */
function dailyHash(iso){
  let h = 0;
  for(let i = 0; i < iso.length; i++){
    h = ((h << 5) - h) + iso.charCodeAt(i);
    h |= 0; // 32-bit
  }
  return Math.abs(h);
}

function quoteForToday(isRest){
  const iso = todayISO();
  const pool = isRest ? REST_DAY_QUOTES : DAILY_QUOTES;
  const idx = dailyHash(iso) % pool.length;
  return pool[idx];
}

/**
 * Returns true if the daily welcome screen should be shown right now.
 * Logic: shown at most once per calendar day. We persist the last
 * shown ISO date in localStorage as 'brazada_daily_last'.
 */
function shouldShowDailyScreen(){
  try{
    const last = localStorage.getItem('brazada_daily_last');
    return last !== todayISO();
  }catch(e){
    return false; // if storage broken, don't annoy the user
  }
}

function markDailyShown(){
  try{
    localStorage.setItem('brazada_daily_last', todayISO());
  }catch(e){}
}

/**
 * Full-screen daily greeting. Shows quote + today's session info.
 * Closes manually via "Empezar" button.
 */
function showDailyScreen(){
  const iso = todayISO();
  const d = parseISO(iso);
  const sessionInfo = getSessionForDate(iso);
  const session = sessionInfo.session;
  const isRest = sessionInfo.isRest;

  const dateLabel = `${DOW_FULL[d.getDay()]} ${d.getDate()} de ${MONTHS[d.getMonth()]}`;
  const quote = quoteForToday(isRest);

  let centerInner;
  if(isRest){
    centerInner = `
      <div class="daily-quote">${quote}</div>
      <div class="daily-divider"></div>
      <div class="daily-session-label">Hoy</div>
      <div class="daily-session-name">Día de <em>descanso</em></div>
    `;
  } else if(session){
    const nameParts = session.name.split(' ');
    const firstWord = nameParts[0];
    const restWords = nameParts.slice(1).join(' ');
    centerInner = `
      <div class="daily-quote">${quote}</div>
      <div class="daily-divider"></div>
      <div class="daily-session-label">Hoy te toca</div>
      <div class="daily-session-name">${firstWord}${restWords ? ` <em>${restWords}</em>` : ''}</div>
      <div class="daily-stats">
        <div class="daily-stat">
          <div class="v">${session.total}<span style="font-size:13px;opacity:0.6;"> m</span></div>
          <div class="l">Distancia</div>
        </div>
        <div class="daily-stat">
          <div class="v">${session.blocks.length}</div>
          <div class="l">Bloques</div>
        </div>
        <div class="daily-stat">
          <div class="v">${session.stroke.split(' ')[0]}</div>
          <div class="l">Estilo</div>
        </div>
      </div>
    `;
  } else {
    // Fallback: no session and not flagged rest (shouldn't happen, but safe)
    centerInner = `
      <div class="daily-quote">${quote}</div>
      <div class="daily-divider"></div>
      <div class="daily-session-label">Hoy</div>
      <div class="daily-session-name">Día <em>libre</em></div>
    `;
  }

  const ctaLabel = isRest ? 'Entendido' : 'Empezar el día';
  const ctaClass = isRest ? 'daily-cta rest' : 'daily-cta';

  const html = `
    <div class="daily-screen" id="dailyScreen">
      <div class="daily-glow tl"></div>
      <div class="daily-glow br"></div>

      <div class="daily-top">
        <div class="daily-eyebrow">Buenos días</div>
        <div class="daily-date">${dateLabel}</div>
      </div>

      <div class="daily-center">
        ${centerInner}
      </div>

      <div class="daily-bottom">
        <button class="${ctaClass}" id="dailyClose">${ctaLabel}</button>
      </div>
    </div>
  `;

  const wrapper = document.createElement('div');
  wrapper.innerHTML = html;
  document.body.appendChild(wrapper.firstElementChild);

  const close = () => {
    const el = document.getElementById('dailyScreen');
    if(!el) return;
    el.classList.add('exiting');
    markDailyShown();
    setTimeout(() => el.remove(), 350);
  };
  document.getElementById('dailyClose').addEventListener('click', close);
}

/* ============================================================
   INIT
============================================================ */
(async function init(){
  await loadState();

  // Show welcome on very first launch
  let welcomed = false;
  try{ welcomed = localStorage.getItem('brazada_welcomed') === '1'; }catch(e){}
  if(!welcomed){
    showWelcomeScreen();
    // First launch: don't double-stack the daily greeting on top.
    // Mark today as already greeted so it doesn't pop up on next session today.
    markDailyShown();
  } else if(shouldShowDailyScreen()){
    // Returning user, first launch of this calendar day → daily greeting
    showDailyScreen();
  }

  render();
})();

  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('./sw.js').catch(err=>console.log('SW reg failed', err));
