        <div style="height:6px;background:rgba(7,42,54,0.1);border-radius:999px;margin-top:12px;overflow:hidden;">
          <div style="height:100%;width:${Math.min(100, Math.max(0, phaseProgress))}%;background:var(--abyss);border-radius:999px;"></div>
        </div>
      </div>
      <div class="stat-card flame">
        <div class="stat-label">Racha</div>
        <div class="stat-value"><span data-animate-num="${calcStreak()}">${calcStreak()}</span><span class="unit">días</span></div>
        <div class="stat-sub">Días seguidos cumpliendo</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Total nadado</div>
        <div class="stat-value"><span data-animate-num="${(total/1000).toFixed(1)}">${(total/1000).toFixed(1)}</span><span class="unit">km</span></div>
        <div class="stat-sub"><span data-animate-num="${sessions}">${sessions}</span> sesiones</div>

  requestAnimationFrame(() => {

    });

}

/**
 * Animates all elements with [data-animate-num] from 0 to their final value.
 * Reads the final value from the element's text content, replaces it with 0,
 * then counts up smoothly using requestAnimationFrame.
 *
 * Format support:
 *   - Plain integers: "42" → counts up to 42
 *   - Decimals (1 place): "1.2" → counts up to 1.2
 *   - With prefix/suffix preserved by reading data-prefix/data-suffix or
 *     by being placed inside an element where surrounding text stays fixed
 */
function animateNumbers(){
  const els = document.querySelectorAll('[data-animate-num]');
  els.forEach(el => {
    const finalText = el.dataset.animateNum;
    const finalNum = parseFloat(finalText);
    if(isNaN(finalNum)) return;
    const isDecimal = finalText.includes('.');
    const decimals = isDecimal ? (finalText.split('.')[1] || '').length : 0;
    const duration = 900; // ms
    const start = performance.now();
    el.textContent = isDecimal ? '0.0' : '0';
    function step(now){
      const elapsed = now - start;
      const t = Math.min(1, elapsed / duration);
      // Ease-out cubic
      const eased = 1 - Math.pow(1 - t, 3);
      const current = finalNum * eased;
      el.textContent = current.toFixed(decimals);
      if(t < 1) requestAnimationFrame(step);
      else el.textContent = finalText; // exact final value
    }
    requestAnimationFrame(step);
  });
}

/**
 * Builds 3-concentric ring SVG (Apple Fitness inspired but with our palette).
 * Outer = coral (today), Middle = gold (week), Inner = tide (phase).
 */
function buildProgressRings({ today, week, phase }){
  // Sizes: outer ring r=88, middle r=68, inner r=48 (stroke-width=14, gap=2)
  const cx = 110, cy = 110;
  const stroke = 14;
  const r1 = 88, r2 = 68, r3 = 48;
  const c1 = 2 * Math.PI * r1;
  const c2 = 2 * Math.PI * r2;
  const c3 = 2 * Math.PI * r3;

  return `
    <svg class="rings-svg" viewBox="0 0 220 220" width="220" height="220">
      <defs>
        <linearGradient id="ringCoral" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#ff8a6b"/>
          <stop offset="100%" stop-color="#e87559"/>
        </linearGradient>
        <linearGradient id="ringGold" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#e8c068"/>
          <stop offset="100%" stop-color="#d4a74a"/>
        </linearGradient>
        <linearGradient id="ringTide" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#5fa4b5"/>
          <stop offset="100%" stop-color="#0e5b6f"/>
        </linearGradient>
      </defs>

      <!-- Background tracks -->
      <circle cx="${cx}" cy="${cy}" r="${r1}" fill="none" stroke="var(--line-soft)" stroke-width="${stroke}"/>
      <circle cx="${cx}" cy="${cy}" r="${r2}" fill="none" stroke="var(--line-soft)" stroke-width="${stroke}"/>
      <circle cx="${cx}" cy="${cy}" r="${r3}" fill="none" stroke="var(--line-soft)" stroke-width="${stroke}"/>

      <!-- Progress rings (start at 0, animated to target via JS) -->
      <circle class="ring-progress" cx="${cx}" cy="${cy}" r="${r1}" fill="none" stroke="url(#ringCoral)" stroke-width="${stroke}" stroke-linecap="round"
              transform="rotate(-90 ${cx} ${cy})"
              stroke-dasharray="${c1.toFixed(2)}" stroke-dashoffset="${c1.toFixed(2)}"
              data-target="${today.toFixed(1)}" data-circumference="${c1.toFixed(2)}"/>
      <circle class="ring-progress" cx="${cx}" cy="${cy}" r="${r2}" fill="none" stroke="url(#ringGold)" stroke-width="${stroke}" stroke-linecap="round"
              transform="rotate(-90 ${cx} ${cy})"
              stroke-dasharray="${c2.toFixed(2)}" stroke-dashoffset="${c2.toFixed(2)}"
              data-target="${week.toFixed(1)}" data-circumference="${c2.toFixed(2)}"/>
      <circle class="ring-progress" cx="${cx}" cy="${cy}" r="${r3}" fill="none" stroke="url(#ringTide)" stroke-width="${stroke}" stroke-linecap="round"
              transform="rotate(-90 ${cx} ${cy})"
              stroke-dasharray="${c3.toFixed(2)}" stroke-dashoffset="${c3.toFixed(2)}"
              data-target="${phase.toFixed(1)}" data-circumference="${c3.toFixed(2)}"/>
    </svg>
  `;
}
function nextMilestone(total){
  const mil = [5000,10000,25000,50000,100000];
  for(const m of mil){
    if(total < m) return `${m/1000} km`;
  }
  return `${Math.ceil(total/100000)*100} km`;
}

/* --------- TAB: EN SECO --------- */
function renderSeco(){
  // Always re-read TODAY (not cached) so it auto-resets each day
  const today = todayISO();
  const todayLog = state.logs[today] || {};
  const dryDone = todayLog.dryDone || [];

  const todayD = new Date();
  const niceDate = DOW_FULL[todayD.getDay()] + ', ' + todayD.getDate() + ' ' + MONTHS[todayD.getMonth()];
  const dow = dayOfWeekMonFirst(todayD);
  const routine = PLAN.dryExercises[dow];

  const renderDryItem = (ex, key, done) => `
    <div class="dry-item ${done?'done':''}" id="dry-${key}">
      <div class="dry-row" data-action="toggle-expand" data-key="${key}">
        <button class="dry-check" data-action="toggle-done" data-key="${key}" aria-label="Marcar hecho">
          <span class="tick"></span>
        </button>
        <div class="dry-name">
          <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 6 15 12 9 18"/></svg>
          ${ex.name}
        </div>
        <div class="dry-reps">${ex.reps}</div>
      </div>
      <div class="dry-desc">${ex.desc || ''}</div>
    </div>`;

  let html = `<section class="section">
    <p class="muted" style="font-size:12px;letter-spacing:0.06em;text-transform:uppercase;font-weight:600;padding:0 6px 8px;color:var(--muted);">${niceDate}</p>
    <div class="hero" style="background:linear-gradient(155deg, var(--abyss) 0%, var(--water) 100%);margin-bottom:14px;">
      <div class="hero-meta">
        <div class="hero-day">Hoy en seco</div>
        <div class="phase-chip">${routine.duration}</div>
      </div>
      <h1 class="hero-title" style="font-size:26px;">${routine.name}</h1>
      <div class="hero-sub">${routine.exercises.length} ejercicios</div>
    </div>
    <div class="dry-list">`;
  routine.exercises.forEach((ex, i)=>{
    const key = 'd'+dow+'_'+i;
    html += renderDryItem(ex, key, dryDone.includes(key));
  });
  html += `</div>
  </section>

  <section class="section">
    <h3 class="section-title">La semana entera</h3>
    <div class="dry-list" style="font-size:13px;">`;
  for(let d=1; d<=7; d++){
    const r = PLAN.dryExercises[d];
    const dn = ['Lunes','Martes','Miércoles','Jueves','Viernes','Sábado','Domingo'][d-1];
    const isToday = d===dow;
    html += `<div style="padding:12px 14px;border-bottom:1px solid var(--line-soft);${isToday?'background:var(--sand);':''}">
      <div style="display:flex;justify-content:space-between;align-items:baseline;gap:10px;">
        <div style="font-weight:${isToday?'600':'500'};color:${isToday?'var(--abyss)':'var(--ink)'};">${dn}${isToday?' · hoy':''}</div>
        <div class="dry-reps" style="font-size:12px;">${r.duration}</div>
      </div>
      <div class="muted" style="font-size:13px;margin-top:2px;">${r.name}</div>
    </div>`;
  }
  html += `</div>
  </section>

  <section class="section">
    <p class="muted center" style="font-size:13px;padding:0 14px;">Toca cualquier ejercicio para ver cómo hacerlo. El círculo de la izquierda lo marca como hecho.<br><br>Las marcas se reinician cada día.</p>
  </section>`;

  $content.innerHTML = html;

  // Tap on row → expand description
  document.querySelectorAll('.dry-row').forEach(row=>{
    row.addEventListener('click', (e)=>{
      if(e.target.closest('.dry-check')) return;
      const item = row.parentElement;
      item.classList.toggle('expanded');
    });
  });

  // Tap on check button → toggle done (in-place)
  document.querySelectorAll('.dry-check').forEach(btn=>{
    btn.addEventListener('click', (e)=>{
      e.stopPropagation();
      toggleDry(btn.dataset.key, btn.closest('.dry-item'));
    });
  });
}

async function toggleDry(key, itemEl){
  // Always use TODAY's date (auto-reset behavior)
  const today = todayISO();
  if(!state.logs[today]) state.logs[today] = {};
  if(!state.logs[today].dryDone) state.logs[today].dryDone = [];
  const arr = state.logs[today].dryDone;
  const pos = arr.indexOf(key);
  if(pos>=0) arr.splice(pos,1); else arr.push(key);

  // In-place visual update (instant, no re-render)
  if(itemEl){
    itemEl.classList.toggle('done', arr.includes(key));
  }
  // Update dots
  updateTabDots();
  // Save in background
  saveState();
}

/* --------- TAB: CRONÓMETRO 400 m --------- */
let timerInterval = null;
let cachedTests = null; // loaded once per render

async function loadTests(){
  try{
    const raw = localStorage.getItem('brazada_tests400');
    if(raw) return JSON.parse(raw);
  }catch(e){ /* none yet */ }
  return [];
}
async function saveTests(tests){
  try{
    localStorage.setItem('brazada_tests400', JSON.stringify(tests));
  }catch(e){ console.error('save tests failed', e); }
}

async function renderCronometro(){
  const t = state.timer;
  const elapsed = t.running ? (Date.now() - t.started) : t.ms;
  const display = formatTime(elapsed);

  cachedTests = await loadTests();
  const tests = cachedTests;

  let testList = '';
  if(tests.length === 0){
    testList = `<div class="log-empty"><span class="big">Sin tests todavía</span>Mide tu 400 m crol cada 4 semanas</div>`;
  } else {
    // Sort by date asc to compute deltas, then show desc
    const sorted = [...tests].sort((a,b)=> (a.ms||0)===(b.ms||0)? a.date.localeCompare(b.date) : 0);
    const byDate = [...tests].sort((a,b)=> a.date.localeCompare(b.date));
    byDate.forEach((test, i)=>{
      test._delta = (i>0) ? (test.ms - byDate[i-1].ms) : null;
    });
    const reverse = [...byDate].reverse();
    reverse.forEach((test, idx)=>{
      let deltaHtml = '';
      if(test._delta !== null){
        const sign = test._delta < 0 ? '−' : '+';
        const abs = Math.abs(test._delta);
        const color = test._delta < 0 ? 'var(--coral)' : 'var(--muted)';
        deltaHtml = `<div style="font-size:11px;color:${color};font-weight:600;margin-top:2px;">${sign}${formatTime(abs)} vs anterior</div>`;
      }
      testList += `<div class="log-item">
        <div class="log-row">
          <div>
            <div class="log-date">${fmtDateShort(test.date)}</div>
            ${deltaHtml}
          </div>
          <div class="log-meta" style="align-items:center;gap:14px;">
            <span class="log-dist" style="font-size:18px;">${test.time}</span>
            <button class="del-test" data-test-id="${test.id || test.date+'_'+test.ms}" aria-label="Borrar" title="Borrar"
              style="background:none;border:none;color:var(--muted);cursor:pointer;font-size:18px;padding:4px 6px;line-height:1;">×</button>
          </div>
        </div>
      </div>`;
    });
  }

  const html = `<section class="section">
    <div class="timer-card">
      <div class="hero-day" style="color:var(--foam);opacity:0.7;">Test 400 m crol</div>
      <div class="timer-display">${display}</div>
      <div class="timer-btns">
        ${t.running
          ? `<button class="timer-btn" id="btnStop">Parar</button>`
          : `<button class="timer-btn" id="btnStart">${t.ms>0?'Continuar':'Empezar'}</button>`
        }
        ${t.ms>0 && !t.running ? `<button class="timer-btn" id="btnSaveTime">Guardar</button>` : ''}
        ${t.ms>0 ? `<button class="timer-btn" id="btnReset">Reset</button>` : ''}
      </div>
    </div>
  </section>

  <section class="section">
    <button class="btn btn-secondary btn-full" id="btnManual" style="display:flex;align-items:center;justify-content:center;gap:8px;">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
      Introducir tiempo manualmente
    </button>
    <p class="muted center" style="font-size:12px;margin-top:8px;">Para cuando te cronometras con tu reloj</p>
  </section>

  <section class="section">
    <h3 class="section-title">Historial de tests</h3>
    <div class="log-list">${testList}</div>
    <p class="muted center" style="font-size:13px;margin-top:14px;">Recomendado: cada 4 semanas, mismo ritmo de ejecución (400 m crol continuos).</p>
  </section>`;

  $content.innerHTML = html;

  if(timerInterval){ clearInterval(timerInterval); timerInterval = null; }

  const startBtn = document.getElementById('btnStart');
  const stopBtn = document.getElementById('btnStop');
  const resetBtn = document.getElementById('btnReset');
  const saveBtn = document.getElementById('btnSaveTime');
  const manualBtn = document.getElementById('btnManual');

  if(startBtn) startBtn.onclick = ()=>{
    state.timer.running = true;
    state.timer.started = Date.now() - state.timer.ms;
    startTimerLoop();
    renderCronometro();
  };
  if(stopBtn) stopBtn.onclick = ()=>{
    state.timer.ms = Date.now() - state.timer.started;
    state.timer.running = false;
    if(timerInterval){ clearInterval(timerInterval); timerInterval = null; }
    renderCronometro();
  };
  if(resetBtn) resetBtn.onclick = ()=>{
    state.timer = { running:false, ms:0, started:null };
    if(timerInterval){ clearInterval(timerInterval); timerInterval = null; }
    renderCronometro();
  };
  if(saveBtn) saveBtn.onclick = async ()=>{
    const all = await loadTests();
    all.push({
      id: 't_'+Date.now(),
      date: todayISO(),
      time: formatTime(state.timer.ms),
      ms: state.timer.ms,
      source: 'cronometro'
    });
    await saveTests(all);
    state.timer = { running:false, ms:0, started:null };
    toast('Tiempo guardado');
    renderCronometro();
  };
  if(manualBtn) manualBtn.onclick = ()=> openManualModal();

  // Delete buttons
  document.querySelectorAll('.del-test').forEach(btn=>{
    btn.addEventListener('click', async (e)=>{
      e.stopPropagation();
      if(!confirm('¿Borrar este tiempo?')) return;
      const id = btn.dataset.testId;
      const all = await loadTests();
      const filtered = all.filter(t => (t.id || t.date+'_'+t.ms) !== id);
      await saveTests(filtered);
      toast('Tiempo borrado');
      renderCronometro();
    });
  });

  if(state.timer.running) startTimerLoop();
}

              style="flex:1;text-align:center;background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:14px;font-family:'Fraunces',serif;font-size:28px;font-weight:500;color:var(--ink);">
          </div>
          <p class="muted" style="font-size:12px;margin-top:8px;">Min : Seg . Centésimas (centésimas opcional)</p>
        </div>

        <div class="actions">
          <button class="btn btn-secondary" id="btnCancelM">Cancelar</button>
          <button class="btn btn-primary" id="btnSaveM">Guardar</button>

      </div>
    </div>
  `;
  document.getElementById('modalRoot').innerHTML = html;

  const minI = document.getElementById('mMin');

  setTimeout(()=>minI.focus(), 100);
  minI.addEventListener('input', ()=>{

  });
  secI.addEventListener('input', ()=>{
    if(secI.value.length >= 2) csI.focus();
  });

  document.getElementById('modalBg').addEventListener('click', closeModal);
  document.getElementById('btnCancelM').onclick = closeModal;
  document.getElementById('btnSaveM').onclick = async ()=>{
    const min = parseInt(minI.value) || 0;
    const sec = parseInt(secI.value) || 0;
    const cs = parseInt(csI.value) || 0;
    const date = document.getElementById('mDate').value || todayISO();

    if(min === 0 && sec === 0){
      toast('Introduce un tiempo válido');
      return;
    }
    if(sec >= 60){
      toast('Los segundos deben ser 0–59');
      return;
    }

    const ms = (min * 60 * 1000) + (sec * 1000) + (cs * 10);
    const all = await loadTests();
    all.push({

      date,
      time: formatTime(ms),
      ms,
      source: 'manual'
    });
    await saveTests(all);
    closeModal();
    toast('Tiempo guardado 🏊');
    renderCronometro();
  };
}
function startTimerLoop(){
  if(timerInterval) clearInterval(timerInterval);
  timerInterval = setInterval(()=>{
    const display = document.querySelector('.timer-display');
    if(display && state.timer.running){
      display.textContent = formatTime(Date.now() - state.timer.started);
    }
  }, 100);
}
function formatTime(ms){
  const total = Math.floor(ms/1000);
  const m = Math.floor(total/60);
  const s = total % 60;
  const cs = Math.floor((ms % 1000)/10);
  return pad(m)+':'+pad(s)+'.'+pad(cs);
}

/* --------- TOAST --------- */
function toast(msg){
  const root = document.getElementById('toastRoot');
  root.innerHTML = `<div class="toast">${msg}</div>`;
  setTimeout(()=>{ root.innerHTML = ''; }, 2200);
}

/* --------- ROUTER --------- */
function updateTabDots(){
  // "Hoy" pending dot: show if today has an available session that hasn't been marked done or skipped
  const today = todayISO();
  const log = state.logs[today] || {};
  const sessionInfo = getSessionForDate(today);
  const hasSession = !!sessionInfo.session;
  const pending = hasSession && !log.done && !log.skipped;

  // "En seco" pending dot: show if today's dry routine has any unfinished exercise
  const dow = dayOfWeekMonFirst(new Date());
  const dryRoutine = PLAN.dryExercises[dow];
  const dryDone = log.dryDone || [];
  const allDryKeys = dryRoutine.exercises.map((_,i) => 'd'+dow+'_'+i);
  const dryPending = allDryKeys.some(k => !dryDone.includes(k));

  document.querySelectorAll('.tab').forEach(t=>{
    const existingDot = t.querySelector('.dot');
    if(existingDot) existingDot.remove();
    if(t.dataset.tab === 'hoy' && pending){
      t.insertAdjacentHTML('beforeend', '<span class="dot"></span>');
    }
    if(t.dataset.tab === 'seco' && dryPending){
      t.insertAdjacentHTML('beforeend', '<span class="dot"></span>');
    }
  });
}

function render(){
  updateTopDate();
  updateTabDots();
  switch(state.activeTab){
    case 'hoy': renderHoy(); break;
    case 'semana': renderSemana(); break;
    case 'historial': renderHistorial(); break;
    case 'progreso': renderProgreso(); break;
    case 'seco': renderSeco(); break;
    case 'cronometro': renderCronometro(); break;
  }
  // Animate numeric values after the DOM is in place
  requestAnimationFrame(() => animateNumbers());
}
