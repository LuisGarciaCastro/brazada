<title>Brazada — Diario de natación</title>

<script>
  // Theme init — must run before paint to avoid flash of wrong theme
  (function(){
    var saved = null;
    try{ saved = localStorage.getItem('brazada_theme'); }catch(e){}
    var theme;
    if(saved === 'light' || saved === 'dark'){
      theme = saved;
    } else {
      // Auto: follow system preference
      theme = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    }
    document.documentElement.setAttribute('data-theme', theme);
  })();
</script>
<style>
:root{
  --deep:#072a36;
  --abyss:#0a3d4a;
  --water:#0e5b6f;
  --tide:#3a8a9c;
  --foam:#a8d8de;
  --sand:#f4ede0;
  --bone:#fbf7ef;
  --coral:#e87559;
  --gold:#d4a74a;
  --ink:#0b1f25;
  --muted:#6b8a92;
  --line:rgba(10,61,74,0.12);
  --line-soft:rgba(10,61,74,0.06);
  --shadow:0 1px 2px rgba(7,42,54,0.04), 0 8px 24px rgba(7,42,54,0.06);

  /* Semantic surfaces (used selectively where light/dark differs most) */
  --bg:var(--bone);
  --surface:#ffffff;
  --surface-2:var(--sand);
  --bg-radial-1:rgba(168,216,222,0.35);
  --bg-radial-2:rgba(232,117,89,0.07);
  /* Always-light for text on dark gradients (hero card, etc.) */
  --on-dark:#fbf7ef;
}

/* Dark mode — designed dark-first, not inverted.
   Tinted neutrals (warm-cool teals), no pure black, halos for depth. */
html[data-theme="dark"]{
  --deep:#020e13;
  --abyss:#0a2630;        /* was #0a3d4a — deeper to be the bg surface */
  --water:#0e5b6f;        /* unchanged — used as accent now */
  --tide:#5fa4b5;         /* lighter so it pops on dark */
  --foam:#a8d8de;         /* unchanged */
  --sand:#1a3540;         /* repurposed: dark "warm" surface for cards */
  --bone:#0a1f26;         /* page bg — deep teal-black (NOT pure black) */
  --coral:#f08a72;        /* slightly brighter coral for dark */
  --gold:#e0b85c;         /* slightly brighter gold for dark */
  --ink:#e8ddc4;          /* warm off-white, NOT #fff */
  --muted:#7a9aa4;        /* lighter than light-mode muted */
  --line:rgba(232,221,196,0.10);
  --line-soft:rgba(232,221,196,0.06);
  --shadow:0 1px 2px rgba(0,0,0,0.4), 0 8px 24px rgba(0,0,0,0.35);

  --bg:#0a1f26;
  --surface:#13313c;       /* primary card surface (luminance shift) */
  --surface-2:#1a3a47;     /* elevated card surface */
  --bg-radial-1:rgba(94,164,181,0.10);
  --bg-radial-2:rgba(240,138,114,0.06);
  --on-dark:#fbf7ef;
}

*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{overscroll-behavior:none;}

body{
  font-family:'Inter Tight', sans-serif;
  background:var(--bg);
  color:var(--ink);
  font-size:16px;
  line-height:1.5;
  min-height:100vh;
  /* iOS safe-area */
  padding-top:env(safe-area-inset-top);
  padding-bottom:env(safe-area-inset-bottom);
  background-image:
    radial-gradient(circle at 15% -10%, var(--bg-radial-1), transparent 50%),
    radial-gradient(circle at 90% 100%, var(--bg-radial-2), transparent 40%);
  background-attachment:fixed;
  transition:background-color 0.3s ease, color 0.3s ease;
}

.app{
  max-width:520px;
  margin:0 auto;
  padding:0 0 100px;
  position:relative;
}

/* ---------- WELCOME SCREEN (first run) ---------- */
.welcome-screen{
  position:fixed;
  inset:0;
  z-index:9999;
  background:linear-gradient(160deg, #072a36 0%, #0a3d4a 50%, #0e5b6f 100%);
  color:#fbf7ef;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:space-between;
  padding:env(safe-area-inset-top) 32px env(safe-area-inset-bottom);
  overflow:hidden;
  animation:fadeIn .6s ease-out;
}
@keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
.welcome-screen.exiting{animation:fadeOut .4s ease-in forwards;}
@keyframes fadeOut{from{opacity:1;}to{opacity:0;transform:scale(1.05);}}
.welcome-waves{
  position:absolute;
  inset:0;
  pointer-events:none;
  opacity:0.18;
}
.welcome-glow{
  position:absolute;
  width:600px;
  height:600px;
  border-radius:50%;
  background:radial-gradient(circle, rgba(232,117,89,0.25) 0%, transparent 60%);
  pointer-events:none;
  animation:glowPulse 6s ease-in-out infinite;
}
.welcome-glow.tl{top:-200px;left:-200px;}
.welcome-glow.br{bottom:-200px;right:-200px;background:radial-gradient(circle, rgba(168,216,222,0.18) 0%, transparent 60%);animation-delay:2s;}
@keyframes glowPulse{
  0%,100%{transform:scale(1);opacity:0.7;}
  50%{transform:scale(1.15);opacity:1;}
}
.welcome-top{
  width:100%;
  padding-top:60px;
  text-align:center;
  position:relative;
  z-index:2;
}
.welcome-mark{
  font-family:'Fraunces', serif;
  font-style:italic;
  font-weight:300;
  font-size:14px;
  letter-spacing:0.18em;
  text-transform:uppercase;
  color:#a8d8de;
  opacity:0.85;
  margin-bottom:8px;
  animation:slideDown .8s ease-out .2s both;
}
.welcome-mark .dot{color:#e87559;font-style:normal;}
@keyframes slideDown{from{opacity:0;transform:translateY(-12px);}to{opacity:0.85;transform:translateY(0);}}
.welcome-center{
  flex:1;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;
  position:relative;
  z-index:2;
  width:100%;
}
.welcome-title{
  font-family:'Fraunces', serif;
  font-style:italic;
  font-weight:400;
  font-size:78px;
  line-height:0.95;
  letter-spacing:-0.04em;
  margin-bottom:14px;
  animation:welcomeRise 1s cubic-bezier(0.2, 0.9, 0.3, 1) .4s both;
}
.welcome-title .dot{color:#e87559;font-style:normal;}
@keyframes welcomeRise{
  from{opacity:0;transform:translateY(40px);}
  to{opacity:1;transform:translateY(0);}
}
.welcome-tagline{
  font-family:'Inter Tight', sans-serif;
  font-weight:300;
  font-size:17px;
  letter-spacing:-0.005em;
  color:#a8d8de;
  opacity:0.85;
  max-width:280px;
  line-height:1.45;
  animation:welcomeRise 1s cubic-bezier(0.2, 0.9, 0.3, 1) .65s both;
}
.welcome-divider{
  width:40px;
  height:1px;
  background:#a8d8de;
  opacity:0.3;
  margin:18px 0 16px;
  animation:welcomeRise 1s cubic-bezier(0.2, 0.9, 0.3, 1) .55s both;
}
.welcome-bottom{
  width:100%;
  padding-bottom:24px;
  text-align:center;
  position:relative;
  z-index:2;
  animation:welcomeRise 1s cubic-bezier(0.2, 0.9, 0.3, 1) .9s both;
}
.welcome-cta{
  background:#e87559;
  color:#fbf7ef;
  border:none;
  border-radius:18px;
  padding:18px 28px;
  font-family:'Inter Tight', sans-serif;
  font-size:16px;
  font-weight:500;
  letter-spacing:0.02em;
  cursor:pointer;
  width:100%;
  max-width:340px;
  box-shadow:0 8px 24px rgba(232,117,89,0.3);
  transition:transform .15s, box-shadow .15s;
  -webkit-tap-highlight-color:transparent;
}
.welcome-cta:active{
  transform:translateY(1px) scale(0.99);
  box-shadow:0 4px 14px rgba(232,117,89,0.25);
}
.welcome-meta{
  margin-top:18px;
  font-size:11px;
  letter-spacing:0.18em;
  text-transform:uppercase;
  font-weight:600;
  color:#a8d8de;
  opacity:0.55;
}

/* ---------- DAILY WELCOME SCREEN (once per day) ---------- */
.daily-screen{
  position:fixed;
  inset:0;
  z-index:9997;
  background:linear-gradient(165deg, #072a36 0%, #0a3d4a 50%, #0e5b6f 100%);
  color:#fbf7ef;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:space-between;
  padding:env(safe-area-inset-top) 32px env(safe-area-inset-bottom);
  overflow:hidden;
  animation:fadeIn .5s ease-out;
}
.daily-screen.exiting{animation:fadeOut .35s ease-in forwards;}
.daily-glow{
  position:absolute;
  width:520px;
  height:520px;
  border-radius:50%;
  pointer-events:none;
  animation:glowPulse 5s ease-in-out infinite;
}
.daily-glow.tl{
  top:-180px; left:-180px;
  background:radial-gradient(circle, rgba(168,216,222,0.20) 0%, transparent 60%);
}
.daily-glow.br{
  bottom:-180px; right:-180px;
  background:radial-gradient(circle, rgba(232,117,89,0.18) 0%, transparent 60%);
  animation-delay:1.8s;
}
.daily-top{
  width:100%;
  padding-top:50px;
  text-align:center;
  position:relative;
  z-index:2;
}
.daily-eyebrow{
  font-family:'Inter Tight', sans-serif;
  font-size:11px;
  letter-spacing:0.22em;
  text-transform:uppercase;
  color:#a8d8de;
  font-weight:600;
  opacity:0.85;
  animation:slideDown .7s ease-out .15s both;
}
.daily-date{
  font-family:'Fraunces', serif;
  font-style:italic;
  font-size:15px;
  font-weight:400;
  color:#a8d8de;
  opacity:0.7;
  margin-top:6px;
  text-transform:capitalize;
  animation:slideDown .7s ease-out .25s both;
}
.daily-center{
  flex:1;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;
  position:relative;
  z-index:2;
  width:100%;
  max-width:380px;
  margin:0 auto;
}
.daily-quote{
  font-family:'Fraunces', serif;
  font-style:italic;
  font-weight:400;
  font-size:30px;
  line-height:1.2;
  letter-spacing:-0.02em;
  margin-bottom:6px;
  animation:welcomeRise 1s cubic-bezier(0.2, 0.9, 0.3, 1) .4s both;
}
.daily-quote::before{
  content:'\201C';
  display:block;
  font-size:60px;
  line-height:0.4;
  color:#e87559;
  opacity:0.8;
  margin-bottom:16px;
}
.daily-divider{
  width:36px;
  height:1px;
  background:#a8d8de;
  opacity:0.35;
  margin:24px auto 22px;
  animation:welcomeRise 1s cubic-bezier(0.2, 0.9, 0.3, 1) .55s both;
}
.daily-session-label{
  font-family:'Inter Tight', sans-serif;
  font-size:10px;
  letter-spacing:0.22em;
  text-transform:uppercase;
  color:#a8d8de;
  opacity:0.7;
  margin-bottom:8px;
  font-weight:600;
  animation:welcomeRise 1s cubic-bezier(0.2, 0.9, 0.3, 1) .65s both;
}
.daily-session-name{
  font-family:'Fraunces', serif;
  font-weight:500;
  font-size:24px;
  letter-spacing:-0.01em;
  margin-bottom:18px;
  animation:welcomeRise 1s cubic-bezier(0.2, 0.9, 0.3, 1) .7s both;
}
.daily-session-name em{
  font-style:italic;
  color:#a8d8de;
  font-weight:400;
}
.daily-stats{
  display:flex;
  gap:24px;
  justify-content:center;
  padding:16px 0 0;
  border-top:1px solid rgba(168,216,222,0.18);
  width:80%;
  animation:welcomeRise 1s cubic-bezier(0.2, 0.9, 0.3, 1) .8s both;
}
.daily-stat{
  text-align:center;
}
.daily-stat .v{
  font-family:'Fraunces', serif;
  font-size:24px;
  font-weight:400;
  letter-spacing:-0.02em;
  color:#fbf7ef;
}
.daily-stat .l{
  font-size:9px;
  letter-spacing:0.16em;
  text-transform:uppercase;
  color:#a8d8de;
  opacity:0.7;
  font-weight:600;
  margin-top:4px;
}
.daily-bottom{
  width:100%;
  padding-bottom:24px;
  text-align:center;
  position:relative;
  z-index:2;
  animation:welcomeRise 1s cubic-bezier(0.2, 0.9, 0.3, 1) .95s both;
}
.daily-cta{
  background:#e87559;
  color:#fbf7ef;
  border:none;
  border-radius:18px;
  padding:18px 28px;
  font-family:'Inter Tight', sans-serif;
  font-size:16px;
  font-weight:500;
  letter-spacing:0.02em;
  cursor:pointer;
  width:100%;
  max-width:340px;
  box-shadow:0 8px 24px rgba(232,117,89,0.3);
  transition:transform .15s, box-shadow .15s;
  -webkit-tap-highlight-color:transparent;
}
.daily-cta:active{
  transform:translateY(1px) scale(0.99);
  box-shadow:0 4px 14px rgba(232,117,89,0.25);
}
.daily-cta.rest{
  background:rgba(168,216,222,0.18);
  border:1px solid rgba(168,216,222,0.35);
  backdrop-filter:blur(8px);
  box-shadow:none;
}
.daily-cta.rest:active{
  background:rgba(168,216,222,0.28);
}

/* ---------- MILESTONE CELEBRATION SCREEN ---------- */
.milestone-screen{
  position:fixed;
  inset:0;
  z-index:9998;
  background:linear-gradient(165deg, #072a36 0%, #0a3d4a 45%, #0e5b6f 100%);
  color:#fbf7ef;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:space-between;
  padding:env(safe-area-inset-top) 32px env(safe-area-inset-bottom);
  overflow:hidden;
  animation:fadeIn .4s ease-out;
  cursor:pointer;
}
.milestone-screen.exiting{animation:fadeOut .4s ease-in forwards;}
.milestone-glow{
  position:absolute;
  width:500px;
  height:500px;
  border-radius:50%;
  pointer-events:none;
  animation:glowPulse 4s ease-in-out infinite;
}
.milestone-glow.tl{
  top:-150px; left:-150px;
  background:radial-gradient(circle, rgba(232,117,89,0.30) 0%, transparent 60%);
}
.milestone-glow.br{
  bottom:-150px; right:-150px;
  background:radial-gradient(circle, rgba(212,167,74,0.20) 0%, transparent 60%);
  animation-delay:1.5s;
}
.milestone-confetti{
  position:absolute;
  inset:0;
  pointer-events:none;
  overflow:hidden;
}
.confetti-piece{
  position:absolute;
  top:-20px;
  border-radius:2px;
  animation:confettiFall 3.5s linear infinite;
  opacity:0.85;
}
@keyframes confettiFall{
  0%{transform:translateY(0) rotate(0deg);opacity:0;}
  10%{opacity:0.85;}
  100%{transform:translateY(110vh) rotate(720deg);opacity:0;}
}
.milestone-content{
  flex:1;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;
  position:relative;
  z-index:2;
  width:100%;
}
.milestone-eyebrow{
  font-family:'Inter Tight', sans-serif;
  font-size:11px;
  letter-spacing:0.22em;
  text-transform:uppercase;
  color:#e87559;
  font-weight:600;
  margin-bottom:14px;
  animation:slideDown .6s ease-out .1s both;
}
.milestone-title{
  font-family:'Fraunces', serif;
  font-style:italic;
  font-weight:400;
  font-size:54px;
  line-height:1.05;
  letter-spacing:-0.03em;
  margin-bottom:10px;
  animation:welcomeRise .9s cubic-bezier(0.2, 0.9, 0.3, 1) .25s both;
}
.milestone-divider{
  width:36px;
  height:1px;
  background:#a8d8de;
  opacity:0.4;
  margin:14px 0 14px;
  animation:welcomeRise .9s cubic-bezier(0.2, 0.9, 0.3, 1) .35s both;
}
.milestone-subtitle{
  font-size:16px;
  color:#a8d8de;
  opacity:0.9;
  font-weight:300;
  letter-spacing:-0.005em;
  max-width:280px;
  line-height:1.45;
  animation:welcomeRise .9s cubic-bezier(0.2, 0.9, 0.3, 1) .45s both;
}
.milestone-sub2{
  margin-top:12px;
  font-family:'Fraunces', serif;
  font-style:italic;
  font-size:14px;
  color:#d4a74a;
  animation:welcomeRise .9s cubic-bezier(0.2, 0.9, 0.3, 1) .55s both;
}
.milestone-bottom{
  width:100%;
  padding-bottom:24px;
  text-align:center;
  position:relative;
  z-index:2;
  animation:welcomeRise .9s cubic-bezier(0.2, 0.9, 0.3, 1) .7s both;
}
.milestone-cta{
  background:rgba(255,255,255,0.12);
  color:#fbf7ef;
  border:1px solid rgba(255,255,255,0.25);
  border-radius:14px;
  padding:14px 28px;
  font-family:'Inter Tight', sans-serif;
  font-size:14px;
  font-weight:500;
  letter-spacing:0.04em;
  cursor:pointer;
  width:100%;
  max-width:340px;
  backdrop-filter:blur(8px);
  -webkit-backdrop-filter:blur(8px);
  transition:transform .15s, background .15s;
  -webkit-tap-highlight-color:transparent;
}
.milestone-cta:active{
  transform:scale(0.98);
  background:rgba(255,255,255,0.18);
}

/* ---------- HEADER ---------- */
.topbar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:18px 22px 8px;
}
.brand{
  font-family:'Fraunces', serif;
  font-weight:500;
  font-style:italic;
  font-size:20px;
  color:var(--ink);
  letter-spacing:-0.01em;
}
.brand span{color:var(--coral);}
.topbar-right{
  display:flex;
  align-items:center;
  gap:12px;
}
.theme-toggle{
  background:transparent;
  border:none;
  color:var(--muted);
  width:34px;
  height:34px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  transition:background .2s, color .2s, transform .15s;
  -webkit-tap-highlight-color:transparent;
}
.theme-toggle:active{transform:scale(0.92);}
.theme-toggle:hover{color:var(--ink);background:var(--surface);}
/* Show the icon for the OPPOSITE theme (the action user takes by clicking) */
.theme-toggle .icon-sun{display:none;}
.theme-toggle .icon-moon{display:block;}
html[data-theme="dark"] .theme-toggle .icon-sun{display:block;}
html[data-theme="dark"] .theme-toggle .icon-moon{display:none;}
.date-pill{
  font-size:11px;
  letter-spacing:0.18em;
  text-transform:uppercase;
  color:var(--muted);
  font-weight:500;
}

/* ---------- TABS ---------- */
.tabs{
  display:flex;
  gap:4px;
  padding:6px 22px 14px;
  overflow-x:auto;
  scrollbar-width:none;
}
.tabs::-webkit-scrollbar{display:none;}
.tab{
  background:transparent;
  border:none;
  font-family:inherit;
  font-size:13px;
  font-weight:500;
  color:var(--muted);
  padding:8px 14px;
  border-radius:999px;
  cursor:pointer;
  white-space:nowrap;
  transition:all .2s;
  letter-spacing:0.01em;
}
.tab.active{
  background:var(--ink);
  color:var(--bg);
}
html[data-theme="dark"] .tab.active{
  background:var(--ink);
  color:var(--abyss);
}
.tab{
  position:relative;
}
.tab .dot{
  display:inline-block;
  width:6px;
  height:6px;
  border-radius:50%;
  background:var(--coral);
  margin-left:5px;
  vertical-align:middle;
  animation:pulse 2s ease-in-out infinite;
}
@keyframes pulse{
  0%, 100% { opacity:1; transform:scale(1); }
  50% { opacity:0.5; transform:scale(0.85); }
}

/* ---------- HERO TODAY ---------- */
.hero{
  margin:6px 16px 18px;
  padding:24px 22px 26px;
  background:linear-gradient(155deg, var(--abyss) 0%, var(--water) 60%, var(--tide) 130%);
  border-radius:24px;
  color:#fbf7ef;
  position:relative;
  overflow:hidden;
  box-shadow:0 12px 32px rgba(7,42,54,0.18);
}
.hero::before{
  content:'';
  position:absolute;
  inset:0;
  background:
    radial-gradient(circle at 90% 10%, rgba(168,216,222,0.18), transparent 50%),
    radial-gradient(circle at 10% 100%, rgba(232,117,89,0.12), transparent 50%);
  pointer-events:none;
}
.hero::after{
  content:'';
  position:absolute;
  inset:0;
  pointer-events:none;
  /* Subtle wave pattern: 2 sine waves repeated */
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 200 80'><path d='M 0 30 Q 25 20 50 30 T 100 30 T 150 30 T 200 30' stroke='%23a8d8de' stroke-width='1' fill='none' opacity='0.5'/><path d='M 0 60 Q 25 50 50 60 T 100 60 T 150 60 T 200 60' stroke='%23a8d8de' stroke-width='1' fill='none' opacity='0.35'/></svg>");
  background-size:200px 80px;
  background-repeat:repeat;
  opacity:0.18;
  mix-blend-mode:soft-light;
}
.hero-meta{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  margin-bottom:16px;
  position:relative;
  z-index:1;
}
.hero-day{
  font-family:'Fraunces', serif;
  font-size:13px;
  font-weight:400;
  letter-spacing:0.16em;
  text-transform:uppercase;
  color:var(--foam);
  opacity:0.85;
}
.phase-chip{
  font-size:10px;
  letter-spacing:0.14em;
  text-transform:uppercase;
  font-weight:600;
  padding:6px 10px;
  border-radius:999px;
  background:rgba(255,255,255,0.13);
  border:1px solid rgba(255,255,255,0.2);
  color:var(--on-dark);
  backdrop-filter:blur(4px);
}
.hero-title{
  font-family:'Fraunces', serif;
  font-weight:400;
  font-size:30px;
  line-height:1.1;
  letter-spacing:-0.02em;
  margin-bottom:6px;
  position:relative;
  z-index:1;
}
.hero-title em{
  font-style:italic;
  color:var(--foam);
}
.hero-sub{
  font-size:14px;
  color:var(--foam);
  opacity:0.8;
  position:relative;
  z-index:1;
  margin-bottom:18px;
}
.hero-stats{
  display:flex;
  gap:18px;
  position:relative;
  z-index:1;
  padding-top:14px;
  border-top:1px solid rgba(255,255,255,0.15);
}
.hero-stat{flex:1;}
.hero-stat .v{
  font-family:'Fraunces', serif;
  font-size:22px;
  font-weight:400;
  letter-spacing:-0.02em;
}
.hero-stat .l{
  font-size:10px;
  letter-spacing:0.14em;
  text-transform:uppercase;
  color:var(--foam);
  opacity:0.7;
  margin-top:2px;
}

/* Rest day variant */
.hero.rest{
  background:linear-gradient(155deg, #2a4a52 0%, #3a6470 100%);
}
.rest-illustration{
  display:block;
  width:100%;
  max-width:240px;
  height:auto;
  margin:8px auto 16px;
  color:#a8d8de;
  position:relative;
  z-index:1;
  animation:fadeInRest .8s ease-out;
}
@keyframes fadeInRest{
  from{opacity:0;transform:translateY(6px);}
  to{opacity:0.95;transform:translateY(0);}
}

/* ---------- SECTION ---------- */
.section{
  margin:0 16px 18px;
}
.section-title{
  font-size:11px;
  letter-spacing:0.2em;
  text-transform:uppercase;
  color:var(--muted);
  font-weight:600;
  margin:0 6px 10px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

/* ---------- BLOCKS (sesión) ---------- */
.blocks{
  background:var(--surface);
  border-radius:20px;
  padding:6px;
  box-shadow:var(--shadow);
}
.block{
  border-radius:14px;
  transition:background .15s;
}
.block:not(:last-child){border-bottom:1px solid var(--line-soft);}
.block-row{
  display:flex;
  gap:12px;
  padding:14px 14px;
  align-items:center;
  cursor:pointer;
  -webkit-tap-highlight-color:transparent;
}
.block-row:active{background:var(--sand);}
.block-main{
  flex:1;
  min-width:0;
}
.block-head{
  display:flex;
  justify-content:space-between;
  align-items:baseline;
  gap:10px;
}
.block-name{
  font-weight:600;
  font-size:14px;
  color:var(--ink);
  letter-spacing:-0.005em;
  display:flex;
  align-items:center;
  gap:8px;
}
.block-name .chev{
  display:inline-block;
  width:14px;
  height:14px;
  flex-shrink:0;
  transition:transform .25s;
  color:var(--muted);
  opacity:0.6;
}
.block.expanded .block-name .chev{
  transform:rotate(90deg);
  opacity:1;
  color:var(--abyss);
}
.block.done .block-name{
  color:var(--muted);
  text-decoration:line-through;
  text-decoration-thickness:1px;
}
.block-dist{
  font-family:'Fraunces', serif;
  font-size:13px;
  color:var(--water);
  font-weight:500;
  white-space:nowrap;
}
.check-btn{
  flex-shrink:0;
  width:32px;
  height:32px;
  border-radius:50%;
  border:1.5px solid var(--line);
  background:var(--surface);
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  transition:all .15s;
  padding:0;
  -webkit-tap-highlight-color:transparent;
}
.check-btn:active{transform:scale(0.92);}
.check-btn .tick{
  width:10px;
  height:5px;
  border-left:1.8px solid transparent;
  border-bottom:1.8px solid transparent;
  transform:rotate(-45deg) translate(1px,-1px);
  transition:border-color .15s;
}
.block.done .check-btn{
  background:var(--abyss);
  border-color:var(--abyss);
}
.block.done .check-btn .tick{
  border-left-color:var(--on-dark);
  border-bottom-color:var(--on-dark);
}
.block-desc{
  max-height:0;
  overflow:hidden;
  transition:max-height .3s ease-out, padding .3s ease-out;
  font-size:13.5px;
  color:var(--ink);
  line-height:1.55;
  padding:0 14px;
}
.block.expanded .block-desc{
  max-height:600px;
  padding:4px 18px 16px 50px;
}
.block-desc strong{
  display:block;
  font-size:11px;
  letter-spacing:0.14em;
  text-transform:uppercase;
  color:var(--water);
  font-weight:700;
  margin-top:10px;
  margin-bottom:3px;
}
.block-desc strong:first-child{margin-top:0;}
.block-desc p{margin:0 0 6px;color:var(--ink);}
.block-desc .tip{
  background:var(--sand);
  padding:8px 12px;
  border-radius:8px;
  margin-top:8px;
  font-size:13px;
  color:var(--ink);
  border-left:2px solid var(--coral);
}
.block-desc .tip-label{
  font-weight:600;
  color:var(--coral);
}

/* ---------- ACTIONS ---------- */
.actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-top:16px;
}
.btn{
  font-family:inherit;
  border:none;
  cursor:pointer;
  font-weight:500;
  font-size:14px;
  padding:14px 16px;
  border-radius:14px;
  transition:all .15s;
  letter-spacing:0.005em;
}
.btn-primary{
  background:var(--abyss);
  color:var(--on-dark);
}
.btn-primary:active{transform:scale(0.98);background:var(--water);}
.btn-secondary{
  background:transparent;
  color:var(--abyss);
  border:1.5px solid var(--line);
}
.btn-secondary:active{background:var(--sand);}
.btn-full{grid-column:1/-1;}
.btn-coral{background:var(--coral);color:white;}
.btn-coral:active{background:#d56549;}

/* ---------- PROGRESS RINGS ---------- */
.rings-card{
  background:var(--surface);
  border-radius:24px;
  padding:24px 22px;
  box-shadow:var(--shadow);
  display:flex;
  align-items:center;
  gap:18px;
}
.rings-svg-wrap{
  flex-shrink:0;
}
.rings-svg{
  display:block;
  filter:drop-shadow(0 4px 12px rgba(7,42,54,0.08));
}
.ring-progress{
  transition:stroke-dashoffset 1.2s cubic-bezier(0.2, 0.9, 0.3, 1);
}
.rings-legend{
  display:flex;
  flex-direction:column;
  gap:14px;
  flex:1;
  min-width:0;
}
.ring-legend-item{
  display:flex;
  align-items:center;
  gap:8px;
}
.ring-dot{
  width:10px;
  height:10px;
  border-radius:50%;
  flex-shrink:0;
}
.ring-label{
  font-size:11px;
  letter-spacing:0.16em;
  text-transform:uppercase;
  color:var(--muted);
  font-weight:600;
  flex:1;
}
.ring-val{
  font-family:'Fraunces', serif;
  font-style:italic;
  font-size:16px;
  color:var(--ink);
  font-weight:500;
}

/* On smaller screens, stack vertically */
@media (max-width: 380px){
  .rings-card{
    flex-direction:column;
    text-align:center;
  }
  .rings-legend{
    width:100%;
  }
}

/* ---------- LOG / STATS ---------- */
.stat-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

/* ---------- WEEK PREVIEW (calendar tab) ---------- */
.day-detail{
  margin-top:14px;
  background:var(--surface);
  border-radius:16px;
  padding:18px 18px;
  box-shadow:var(--shadow);
  animation:fadeInUp .25s ease-out;
  position:relative;
  overflow:hidden;
}
.dd-stripe{
  position:absolute;
  left:0;
  top:0;
  bottom:0;
  width:4px;
  border-radius:4px 0 0 4px;
}
@keyframes fadeInUp{
  from{opacity:0;transform:translateY(-6px);}
  to{opacity:1;transform:translateY(0);}
}
.day-detail.today{
  background:linear-gradient(135deg, var(--abyss), var(--water));
  color:var(--on-dark);
}
.day-detail.rest-day{
  background:transparent;
  border:1.5px dashed var(--line);
  box-shadow:none;
}
.dd-head{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  margin-bottom:14px;
  gap:10px;
}
.dd-date{
  font-family:'Fraunces', serif;
  font-size:18px;
  font-weight:500;
  letter-spacing:-0.01em;
  color:var(--ink);
  line-height:1.2;
}
.day-detail.today .dd-date{color:var(--on-dark);}
.dd-context{
  font-size:10px;
  letter-spacing:0.14em;
  text-transform:uppercase;
  color:var(--muted);
  font-weight:600;
  margin-top:3px;
}
.day-detail.today .dd-context{color:var(--foam);opacity:0.85;}
.dd-status{
  font-size:10px;
  letter-spacing:0.14em;
  text-transform:uppercase;
  font-weight:700;
  padding:4px 10px;
  border-radius:999px;
  white-space:nowrap;
  flex-shrink:0;
}
.dd-status.done{background:var(--coral);color:white;}
.dd-status.skipped{background:var(--line);color:var(--muted);}
.dd-status.rest-pill{background:var(--line-soft);color:var(--muted);}
.dd-session-name{
  font-family:'Fraunces', serif;
  font-size:24px;
  font-weight:500;
  letter-spacing:-0.02em;
  margin-bottom:4px;
  line-height:1.15;
}
.day-detail.today .dd-session-name{color:var(--on-dark);}
.dd-session-name em{
  font-style:italic;
  color:var(--water);
}
.day-detail.today .dd-session-name em{color:var(--foam);}
.dd-stroke{
  font-size:13px;
  color:var(--muted);
  margin-bottom:14px;
}
.day-detail.today .dd-stroke{color:var(--foam);opacity:0.85;}
.dd-stats{
  display:flex;
  gap:18px;
  padding:12px 0;
  border-top:1px solid var(--line-soft);
  border-bottom:1px solid var(--line-soft);
  margin-bottom:14px;
}
.day-detail.today .dd-stats{
  border-color:rgba(255,255,255,0.15);
}
.dd-stat{flex:1;}
.dd-stat .v{
  font-family:'Fraunces', serif;
  font-size:20px;
  line-height:1;
  font-weight:500;
}
.dd-stat .l{
  font-size:9px;
  letter-spacing:0.14em;
  text-transform:uppercase;
  color:var(--muted);
  font-weight:600;
  margin-top:4px;
}
.day-detail.today .dd-stat .l{color:var(--foam);opacity:0.7;}
.dd-blocks{
  font-size:13px;
  line-height:1.6;
}
.dd-block-row{
  display:flex;
  justify-content:space-between;
  gap:10px;
  padding:6px 0;
}
.dd-block-row:not(:last-child){
  border-bottom:1px dashed var(--line-soft);
}
.day-detail.today .dd-block-row:not(:last-child){
  border-bottom-color:rgba(255,255,255,0.15);
}
.dd-block-name{color:var(--ink);}
.day-detail.today .dd-block-name{color:var(--on-dark);opacity:0.92;}
.dd-block-dist{
  font-family:'Fraunces', serif;
  font-style:italic;
  color:var(--water);
  font-weight:500;
  white-space:nowrap;
}
.day-detail.today .dd-block-dist{color:var(--foam);}
.dd-cta{
  margin-top:14px;
  display:block;
  width:100%;
  background:var(--abyss);
  color:var(--on-dark);
  border:none;
  border-radius:12px;
  padding:12px;
  font-family:inherit;
  font-size:14px;
  font-weight:500;
  cursor:pointer;
  text-align:center;
}
.dd-cta:active{transform:scale(0.99);}
.day-detail.today .dd-cta{
  background:var(--surface);
  color:var(--abyss);
}
.dd-rest-explain{
  font-size:14px;
  line-height:1.55;
  color:var(--ink);
}
.dd-notes{
  margin-top:12px;
  padding:10px 12px;
  background:var(--sand);
  border-radius:10px;
  font-size:13px;
  font-style:italic;
  color:var(--ink);
  line-height:1.5;
}
.day-detail.today .dd-notes{
  background:rgba(255,255,255,0.1);
  color:var(--on-dark);
}
.week-nav{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:12px;
  padding:0 4px;
}
.week-nav-title{
  font-family:'Fraunces', serif;
  font-size:15px;
  font-weight:500;
  color:var(--ink);
}
.week-nav-title .sub{
  display:block;
  font-size:11px;
  letter-spacing:0.14em;
  text-transform:uppercase;
  color:var(--muted);
  font-weight:600;
  font-family:'Inter Tight', sans-serif;
  font-style:normal;
  margin-bottom:2px;
}
.week-nav button{
  width:32px;
  height:32px;
  border-radius:50%;
  border:1px solid var(--line);
  background:var(--surface);
  cursor:pointer;
  font-size:14px;
  color:var(--abyss);
  display:flex;
  align-items:center;
  justify-content:center;
  flex-shrink:0;
}
.week-nav button:active{background:var(--sand);}
.week-nav .arrows{display:flex;gap:6px;}
.week-cards{
  display:flex;
  flex-direction:column;
  gap:8px;
}
.week-card{
  background:var(--surface);
  border-radius:14px;
  padding:12px 14px;
  box-shadow:var(--shadow);
  display:flex;
  align-items:center;
  gap:12px;
  cursor:pointer;
  transition:background .12s, transform .12s;
  -webkit-tap-highlight-color:transparent;
  position:relative;
}
.week-card:active{transform:scale(0.99);}
.week-card.today{
  background:linear-gradient(135deg, var(--abyss), var(--water));
  color:var(--on-dark);
}
.week-card.today .wc-name,
.week-card.today .wc-dist{color:var(--on-dark);}
.week-card.today .wc-day{color:var(--foam);}
.week-card.today .wc-stroke{color:var(--foam);opacity:0.85;}
.week-card.done{
  background:var(--sand);
}
.week-card.skipped{
  opacity:0.55;
}
.week-card.rest{
  background:transparent;
  border:1.5px dashed var(--line);
  box-shadow:none;
  opacity:0.7;
}
.wc-day{
  flex-shrink:0;
  width:42px;
  text-align:center;
}
.wc-day-name{
  font-size:9px;
  letter-spacing:0.14em;
  text-transform:uppercase;
  color:var(--muted);
  font-weight:600;
}
.wc-day-num{
  font-family:'Fraunces', serif;
  font-size:22px;
  line-height:1;
  font-weight:500;
  color:var(--ink);
  margin-top:3px;
}
.week-card.today .wc-day-num{color:var(--on-dark);}
.week-card.today .wc-day-name{color:var(--foam);}
.wc-divider{
  width:1px;
  align-self:stretch;
  background:var(--line-soft);
  flex-shrink:0;
}
.week-card.today .wc-divider{background:rgba(255,255,255,0.2);}
.week-card.rest .wc-divider{display:none;}
.wc-info{
  flex:1;
  min-width:0;
}
.wc-name{
  font-size:14px;
  font-weight:600;
  color:var(--ink);
  letter-spacing:-0.005em;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.wc-stroke{
  font-size:12px;
  color:var(--muted);
  margin-top:1px;
}
.wc-meta{
  flex-shrink:0;
  text-align:right;
}
.wc-dist{
  font-family:'Fraunces', serif;
  font-style:italic;
  font-size:14px;
  color:var(--water);
  font-weight:500;
}
.week-card.today .wc-dist{color:var(--foam);font-style:italic;}
.wc-status{
  font-size:10px;
  letter-spacing:0.14em;
  text-transform:uppercase;
  color:var(--muted);
  font-weight:600;
  margin-top:2px;
}
.wc-status.done{color:var(--coral);}
.wc-status.skipped{color:var(--muted);}
.week-card.today .wc-status{color:var(--foam);opacity:0.7;}
.wc-rest-label{
  flex:1;
  font-style:italic;
  color:var(--muted);
  font-size:13px;
}
.stat-card{
  background:var(--surface);
  border-radius:18px;
  padding:18px 18px;
  box-shadow:var(--shadow);
  position:relative;
  overflow:hidden;
}
.stat-card.featured{
  grid-column:1/-1;
  background:linear-gradient(135deg, var(--sand), #f0e6d3);
}
.stat-label{
  font-size:10px;
  letter-spacing:0.16em;
  text-transform:uppercase;
  color:var(--muted);
  font-weight:600;
  margin-bottom:8px;
}
.stat-value{
  font-family:'Fraunces', serif;
  font-size:34px;
  line-height:1;
  font-weight:400;
  letter-spacing:-0.03em;
  color:var(--ink);
}
.stat-value .unit{
  font-size:14px;
  color:var(--muted);
  margin-left:4px;
  font-weight:400;
  font-style:italic;
}
.stat-sub{
  font-size:12px;
  color:var(--muted);
  margin-top:6px;
}
.stat-card.flame .stat-value{color:var(--coral);}

/* ---------- CALENDAR ---------- */
.calendar{
  background:var(--surface);
  border-radius:20px;
  padding:18px;
  box-shadow:var(--shadow);
}
.cal-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:14px;
}
.cal-title{
  font-family:'Fraunces', serif;
  font-size:18px;
  font-weight:500;
  letter-spacing:-0.01em;
  text-transform:capitalize;
}
.cal-nav{
  display:flex;
  gap:6px;
}
.cal-nav button{
  width:32px;
  height:32px;
  border-radius:50%;
  border:1px solid var(--line);
  background:var(--surface);
  cursor:pointer;
  font-size:14px;
  color:var(--abyss);
  display:flex;
  align-items:center;
  justify-content:center;
}
.cal-nav button:active{background:var(--sand);}
.cal-grid{
  display:grid;
  grid-template-columns:repeat(7, 1fr);
  gap:4px;
}
.cal-dow{
  text-align:center;
  font-size:10px;
  letter-spacing:0.1em;
  text-transform:uppercase;
  color:var(--muted);
  font-weight:600;
  padding:6px 0;
}
.cal-day{
  aspect-ratio:1;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:13px;
  border-radius:10px;
  position:relative;
  font-weight:500;
  color:var(--ink);
  cursor:pointer;
  transition:background .12s, transform .1s;
  -webkit-tap-highlight-color:transparent;
}
.cal-day:not(.empty):active{transform:scale(0.92);}
.cal-day.empty{color:transparent;pointer-events:none;cursor:default;}
.cal-day.future{color:var(--muted);opacity:0.4;}
.cal-day.today{
  background:var(--abyss);
  color:var(--on-dark);
}
.cal-day.done:not(.today){
  background:var(--foam);
  color:var(--abyss);
}
.cal-day.done.today{
  background:var(--coral);
  color:white;
}
.cal-day.selected:not(.today):not(.done){
  background:var(--sand);
  outline:2px solid var(--abyss);
  outline-offset:-2px;
}
.cal-day.selected.today{
  outline:2px solid var(--coral);
  outline-offset:2px;
}
.cal-day.selected.done:not(.today){
  outline:2px solid var(--abyss);
  outline-offset:-2px;
}
.cal-day.skipped{
  color:var(--muted);
  text-decoration:line-through;
}
.cal-day.rest:not(.today):not(.done){
  color:var(--muted);
  opacity:0.4;
  font-size:10px;
}
.cal-day.rest:not(.today):not(.done)::after{
  content:'';
  position:absolute;
  bottom:6px;
  width:3px;
  height:3px;
  border-radius:50%;
  background:var(--muted);
}

/* ---------- LOG LIST ---------- */
.log-list{
  background:var(--surface);
  border-radius:20px;
  padding:6px;
  box-shadow:var(--shadow);
}
.log-item{
  padding:14px;
  border-bottom:1px solid var(--line-soft);
  position:relative;
  padding-left:18px;
}
.log-item::before{
  content:'';
  position:absolute;
  left:6px;
  top:14px;
  bottom:14px;
  width:3px;
  border-radius:3px;
  background:var(--stripe-color, transparent);
}
.log-item:last-child{border-bottom:none;}
.log-row{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:10px;
  margin-bottom:4px;
}
.log-date{
  font-family:'Fraunces', serif;
  font-size:15px;
  font-weight:500;
}
.log-meta{
  font-size:12px;
  color:var(--muted);
  display:flex;
  gap:10px;
  align-items:center;
}
.log-dist{
  font-family:'Fraunces', serif;
  font-style:italic;
  color:var(--water);
  font-weight:500;
}
.log-feel{
  display:inline-flex;
  align-items:center;
  gap:4px;
}
.log-notes{
  font-size:13px;
  color:var(--muted);
  margin-top:6px;
  font-style:italic;
  line-height:1.4;
}
.log-empty{
  text-align:center;
  padding:40px 20px;
  color:var(--muted);
  font-size:14px;
}
.log-empty .big{
  font-family:'Fraunces', serif;
  font-style:italic;
  font-size:20px;
  color:var(--abyss);
  margin-bottom:6px;
  display:block;
}

/* ---------- CHART ---------- */
.chart{
  background:var(--surface);
  border-radius:20px;
  padding:18px;
  box-shadow:var(--shadow);
}
.chart-title{
  font-family:'Fraunces', serif;
  font-size:16px;
  font-weight:500;
  margin-bottom:14px;
}
.chart-bars{
  display:flex;
  align-items:flex-end;
  gap:8px;
  height:120px;
  padding:0 4px;
}
.chart-col{
  flex:1;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:6px;
  height:100%;
  justify-content:flex-end;
}
.chart-bar{
  width:100%;
  background:linear-gradient(180deg, var(--tide), var(--water));
  border-radius:6px 6px 2px 2px;
  min-height:3px;
  transition:height .4s ease-out;
}
.chart-bar.zero{background:var(--line);}
.chart-label{
  font-size:10px;
  color:var(--muted);
  letter-spacing:0.06em;
  text-transform:uppercase;
  font-weight:600;
}

/* ---------- MODAL ---------- */
.modal-bg{
  position:fixed;
  inset:0;
  background:rgba(7,42,54,0.5);
  backdrop-filter:blur(4px);
  z-index:100;
  display:flex;
  align-items:flex-end;
  justify-content:center;
  animation:fade .2s;
}
@keyframes fade{from{opacity:0;}to{opacity:1;}}
@keyframes slideUp{from{transform:translateY(100%);}to{transform:translateY(0);}}
.modal{
  background:var(--surface);
  width:100%;
  max-width:520px;
  border-radius:24px 24px 0 0;
  padding:24px 22px 32px;
  animation:slideUp .25s ease-out;
  max-height:90vh;
  overflow-y:auto;
}
.modal-handle{
  width:38px;
  height:4px;
  background:var(--line);
  border-radius:999px;
  margin:-10px auto 14px;
}
.modal h3{
  font-family:'Fraunces', serif;
  font-weight:500;
  font-size:22px;
  letter-spacing:-0.02em;
  margin-bottom:18px;
}
.field{margin-bottom:16px;}
.field label{
  display:block;
  font-size:11px;
  letter-spacing:0.16em;
  text-transform:uppercase;
  color:var(--muted);
  font-weight:600;
  margin-bottom:8px;
}
.field input[type="number"], .field textarea{
  width:100%;
  background:var(--surface);
  border:1.5px solid var(--line);
  border-radius:12px;
  padding:12px 14px;
  font-family:inherit;
  font-size:15px;
  color:var(--ink);
  transition:border .15s;
}
.field input:focus, .field textarea:focus{
  outline:none;
  border-color:var(--abyss);
}
.field textarea{resize:vertical;min-height:70px;}
.feel-row{
  display:flex;
  gap:8px;
}
.feel-btn{
  flex:1;
  padding:14px 4px;
  background:var(--surface);
  border:1.5px solid var(--line);
  border-radius:12px;
  cursor:pointer;
  font-size:22px;
  transition:all .15s;
  font-family:inherit;
}
.feel-btn.selected{
  border-color:var(--abyss);
  background:var(--sand);
}

/* ---------- TIMER ---------- */
.timer-card{
  background:linear-gradient(155deg, var(--deep), var(--water));
  border-radius:20px;
  padding:28px 22px;
  color:var(--on-dark);
  text-align:center;
  box-shadow:var(--shadow);
}
.timer-display{
  font-family:'Fraunces', serif;
  font-size:64px;
  font-weight:300;
  letter-spacing:-0.04em;
  line-height:1;
  margin:14px 0 18px;
  font-variant-numeric:tabular-nums;
}
.timer-btns{
  display:flex;
  gap:10px;
  justify-content:center;
}
.timer-btn{
  background:rgba(255,255,255,0.15);
  border:1px solid rgba(255,255,255,0.25);
  color:var(--on-dark);
  padding:12px 24px;
  border-radius:999px;
  font-family:inherit;
  font-weight:500;
  font-size:14px;
  cursor:pointer;
  backdrop-filter:blur(4px);
}
.timer-btn:active{background:rgba(255,255,255,0.25);}

/* ---------- DRY EXERCISES ---------- */
.dry-list{
  background:var(--surface);
  border-radius:20px;
  padding:6px;
  box-shadow:var(--shadow);
}
.dry-item{
  border-bottom:1px solid var(--line-soft);
}
.dry-item:last-child{border-bottom:none;}
.dry-row{
  display:flex;
  gap:12px;
  align-items:center;
  padding:12px 14px;
  cursor:pointer;
  -webkit-tap-highlight-color:transparent;
  border-radius:10px;
  transition:background .12s;
}
.dry-row:active{background:var(--sand);}
.dry-check{
  flex-shrink:0;
  width:30px;
  height:30px;
  border-radius:50%;
  border:1.5px solid var(--line);
  background:var(--surface);
  display:flex;
  align-items:center;
  justify-content:center;
  transition:all .15s;
  cursor:pointer;
}
.dry-check:active{transform:scale(0.92);}
.dry-check .tick{
  width:9px;
  height:4px;
  border-left:1.8px solid transparent;
  border-bottom:1.8px solid transparent;
  transform:rotate(-45deg) translate(1px,-1px);
}
.dry-item.done .dry-check{
  background:var(--abyss);
  border-color:var(--abyss);
}
.dry-item.done .dry-check .tick{
  border-left-color:var(--on-dark);
  border-bottom-color:var(--on-dark);
}
.dry-item.done .dry-name{
  color:var(--muted);
  text-decoration:line-through;
  text-decoration-thickness:1px;
}
.dry-name{
  flex:1;
  font-size:14px;
  transition:color .15s;
  font-weight:500;
  display:flex;
  align-items:center;
  gap:8px;
}
.dry-name .chev{
  display:inline-block;
  width:13px;
  height:13px;
  flex-shrink:0;
  transition:transform .25s;
  color:var(--muted);
  opacity:0.6;
}
.dry-item.expanded .dry-name .chev{
  transform:rotate(90deg);
  opacity:1;
  color:var(--abyss);
}
.dry-reps{
  font-family:'Fraunces', serif;
  font-style:italic;
  font-size:13px;
  color:var(--muted);
}
.dry-desc{
  max-height:0;
  overflow:hidden;
  transition:max-height .3s ease-out, padding .3s ease-out;
  font-size:13.5px;
  color:var(--ink);
  line-height:1.55;
  padding:0 14px;
}
.dry-item.expanded .dry-desc{
  max-height:500px;
  padding:4px 18px 16px 56px;
}
.dry-desc strong{
  display:block;
  font-size:11px;
  letter-spacing:0.14em;
  text-transform:uppercase;
  color:var(--water);
  font-weight:700;
  margin-top:10px;
  margin-bottom:3px;
}
.dry-desc strong:first-child{margin-top:0;}
.dry-desc p{margin:0 0 6px;color:var(--ink);}
.dry-desc .tip{
  background:var(--sand);
  padding:8px 12px;
  border-radius:8px;
  margin-top:8px;
  font-size:13px;
  color:var(--ink);
  border-left:2px solid var(--coral);
}
.dry-desc .tip-label{
  font-weight:600;
  color:var(--coral);
}

/* ---------- TOAST ---------- */
.toast{
  position:fixed;
  bottom:24px;
  left:50%;
  transform:translateX(-50%);
  background:var(--abyss);
  color:var(--on-dark);
  padding:12px 20px;
  border-radius:999px;
  font-size:14px;
  z-index:200;
  box-shadow:0 8px 24px rgba(7,42,54,0.3);
  animation:toastIn .2s;
  font-weight:500;
}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,10px);}to{opacity:1;transform:translate(-50%,0);}}

/* ---------- DAY PICKER ---------- */
.day-picker{
  display:flex;
  gap:6px;
  padding:0 16px 12px;
  overflow-x:auto;
  scrollbar-width:none;
}
.day-picker::-webkit-scrollbar{display:none;}
.day-pick{
  flex-shrink:0;
  background:var(--surface);
  border:1.5px solid var(--line);
  border-radius:14px;
  padding:8px 12px;
  cursor:pointer;
  font-family:inherit;
  text-align:center;
  min-width:54px;
  transition:all .15s;
}
.day-pick.active{
  background:var(--abyss);
  border-color:var(--abyss);
  color:var(--on-dark);
}
.day-pick.done{
  background:var(--foam);
  border-color:var(--foam);
}
.day-pick.done.active{
  background:var(--abyss);
  border-color:var(--abyss);
  color:var(--on-dark);
}
.dp-dow{
  font-size:10px;
  letter-spacing:0.1em;
  text-transform:uppercase;
  font-weight:600;
  opacity:0.7;
}
.dp-num{
  font-family:'Fraunces', serif;
  font-size:18px;
  font-weight:500;
  margin-top:2px;
}
.day-pick.done:not(.active) .dp-num::after{
  content:'•';
  color:var(--coral);
  margin-left:2px;
}
.day-pick.rest{
  background:transparent;
  border:1.5px dashed var(--line);
  opacity:0.55;
}
.day-pick.rest .dp-num{
  font-size:14px;
  color:var(--muted);
}
.day-pick.rest.active{
  background:var(--abyss);
  border-color:var(--abyss);
  border-style:solid;
  color:var(--on-dark);
  opacity:1;
}
.day-pick.rest.active .dp-num{color:var(--on-dark);}

/* small text helper */
.muted{color:var(--muted);font-size:13px;}
.center{text-align:center;}
.divider{
  height:1px;
  background:var(--line-soft);
  margin:14px 0;
}
</style>
</head>

<script>
/* ============================================================
   PLAN DATA
============================================================ */
const PLAN = {
  // sessions[dayOfWeek 0=Sun..6=Sat] but we use 1..7 = Mon..Sun
  sessions: {
    1: { // Lunes
      name: "Técnica + suave",
      stroke: "Crol",
      total: 700,
      blocks: [
        { name: "Calentamiento", dist: 150, desc:
          `<strong>Qué haces</strong>
           <p>3 largos suaves (150 m): alterna crol y espalda. Despacio, sin forzar.</p>
           <strong>Cómo</strong>
           <p>Respira cuando quieras. El objetivo no es ir rápido, es soltar hombros y meterte en el agua.</p>
           <div class="tip"><span class="tip-label">Recuerda</span> · si te falta el aire, vas demasiado rápido. Baja el ritmo.</div>` },
        { name: "Técnica – brazada larga", dist: 150, desc:
          `<strong>Qué haces</strong>
           <p>3 series de 50 m. En la <b>ida</b>, "punto muerto". En la <b>vuelta</b>, crol normal.</p>
           <strong>El "punto muerto" paso a paso</strong>
           <p>1. Estira un brazo delante (como si quisieras tocar la pared opuesta).<br>
              2. Ese brazo se queda quieto, esperando.<br>
              3. El otro brazo da una brazada completa hasta tocar al primero.<br>
              4. Cuando se tocan, el que estaba quieto empieza a tirar. Y así.</p>
           <strong>Descanso</strong>
           <p>25 segundos en la pared entre cada 50 m.</p>
           <div class="tip"><span class="tip-label">Por qué</span> · te obliga a "alargar" la brazada en vez de mover los brazos rápido. Es la base de nadar bien.</div>` },
        { name: "Principal – crol cómodo", dist: 300, desc:
          `<strong>Qué haces</strong>
           <p>6 series de 50 m a crol normal, a un ritmo cómodo (que puedas mantener una conversación entrecortada).</p>
           <strong>Foco</strong>
           <p>Alarga cada brazada. Mejor pocas brazadas largas que muchas cortas y rápidas.</p>
           <strong>Descanso</strong>
           <p>20 segundos en la pared entre cada 50 m. Si lo necesitas, 25-30.</p>` },
        { name: "Vuelta a la calma", dist: 100, desc:
          `<strong>Qué haces</strong>
           <p>2 largos suaves (100 m): 1 a espalda + 1 a crol respirando cada 3 brazadas.</p>
           <strong>Respirar cada 3 brazadas</strong>
           <p>En crol, en lugar de respirar siempre por el mismo lado, cuentas: brazada-1, brazada-2, respiras al lado derecho, brazada-1, brazada-2, respiras al lado izquierdo. Y así.</p>
           <div class="tip"><span class="tip-label">Por qué</span> · respirar siempre por el mismo lado descompensa hombros y cuello. Esto los iguala.</div>` },
      ]
    },
    2: { // Martes
      name: "Series cortas",
      stroke: "Crol",
      total: 700,
      blocks: [
        { name: "Calentamiento", dist: 150, desc:
          `<strong>Qué haces</strong>
           <p>3 largos suaves (150 m), alternando crol y espalda.</p>
           <strong>Cómo</strong>
           <p>Pulso bajo, respiración cómoda. Estás preparando el cuerpo, no compitiendo.</p>` },
        { name: "Activación", dist: 100, desc:
          `<strong>Qué haces</strong>
           <p>4 largos cortos de 25 m a crol, cada uno un poco más rápido que el anterior.</p>
           <strong>Ritmo</strong>
           <p>1º: suave (como en el calentamiento).<br>
              2º: medio.<br>
              3º: rápido.<br>
              4º: casi al máximo.</p>
           <strong>Descanso</strong>
           <p>25 segundos en la pared entre cada uno.</p>
           <div class="tip"><span class="tip-label">Por qué</span> · prepara el cuerpo para la parte intensa que viene.</div>` },
        { name: "Principal – series intensas", dist: 300, desc:
          `<strong>Qué haces</strong>
           <p>6 largos de 50 m a crol, a ritmo <b>fuerte</b>.</p>
           <strong>Qué significa "fuerte"</strong>
           <p>Aproximadamente al 80% de tu máximo. Acabas el largo respirando bastante, pero no completamente reventado.</p>
           <strong>Descanso</strong>
           <p>30-40 segundos en la pared entre cada 50 m. Aprovecha bien para recuperar.</p>
           <div class="tip"><span class="tip-label">Aviso</span> · si te quedas sin aire a la mitad, baja un poco el ritmo. Mejor 6 largos sostenidos que 3 a tope y morir.</div>` },
        { name: "Vuelta a la calma", dist: 150, desc:
          `<strong>Qué haces</strong>
           <p>3 largos muy suaves (150 m): alternando espalda y crol.</p>
           <strong>Cómo</strong>
           <p>Lentísimo. Esto baja el pulso y evita que salgas mareado de la piscina.</p>` },
      ]
    },
    3: { // Miércoles
      name: "Espalda y postura",
      stroke: "Espalda",
      total: 750,
      blocks: [
        { name: "Calentamiento", dist: 150, desc:
          `<strong>Qué haces</strong>
           <p>3 largos suaves (150 m): alternando crol y espalda.</p>
           <strong>Cómo</strong>
           <p>En la espalda, túmbate bien plano, mirada al techo, sin levantar la cabeza.</p>` },
        { name: "Drills – espalda con un brazo", dist: 150, desc:
          `<strong>Qué haces</strong>
           <p>3 series de 50 m. En la <b>ida</b>, espalda con un solo brazo. En la <b>vuelta</b>, espalda normal.</p>
           <strong>Espalda con un brazo paso a paso</strong>
           <p>1. Túmbate boca arriba en el agua.<br>
              2. Un brazo pegado al costado, sin moverlo.<br>
              3. El otro brazo hace todo el trabajo: sale del agua, va por encima, entra detrás de la cabeza, tira.<br>
              4. Haz 25 m con un brazo, da la vuelta y haz los siguientes 25 m con el otro brazo.</p>
           <strong>Descanso</strong>
           <p>25 segundos entre cada 50 m.</p>
           <div class="tip"><span class="tip-label">Por qué</span> · obliga a cada lado del cuerpo a trabajar por separado. Iguala asimetrías y abre el pecho — clave para tu postura.</div>` },
        { name: "Principal – espalda continua", dist: 300, desc:
          `<strong>Qué haces</strong>
           <p>6 largos de 50 m a espalda normal, a ritmo cómodo.</p>
           <strong>Foco postural</strong>
           <p>• Mirada fija al techo (si miras la pared, hundes la cadera).<br>
              • Cadera arriba, como si quisieras sacar el ombligo del agua.<br>
              • Brazos completamente estirados, no doblados.</p>
           <strong>Descanso</strong>
           <p>20 segundos entre cada 50 m.</p>
           <div class="tip"><span class="tip-label">Por qué</span> · la espalda es el estilo postural por excelencia. Abre pecho, activa la musculatura entre los omoplatos y compensa el "encorvamiento" de oficina/móvil.</div>` },
        { name: "Vuelta a la calma", dist: 150, desc:
          `<strong>Qué haces</strong>
           <p>3 largos de crol suaves, respirando cada 3 brazadas (alternando lados).</p>
           <strong>Recordatorio</strong>
           <p>Brazada-1, brazada-2, respiro derecha. Brazada-1, brazada-2, respiro izquierda. Y así.</p>` },
      ]
    },
    4: { // Jueves
      name: "Pull / brazos",
      stroke: "Crol con pull-buoy",

const DOW_NAMES = ['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];
const DOW_FULL = ['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];
const MONTHS = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];

/* ============================================================
   STATE & STORAGE
============================================================ */
let state = {
  startDate: null,        // YYYY-MM-DD: first day of plan
  logs: {},               // { 'YYYY-MM-DD': { done, distance, feel, notes, blocksDone:[idx] } }
  selectedDate: null,     // YYYY-MM-DD currently viewed
  calMonth: null,         // {year, month}
  weekPreviewMonday: null, // ISO date of Monday for the week-by-week preview
  calSelectedDay: null,    // ISO date currently selected in the calendar (shows detail below)
  activeTab: 'hoy',
  timer: { running:false, ms:0, started:null }
};

async function loadState(){
  try{
    const raw = localStorage.getItem('brazada_state');
    if(raw){
      state = { ...state, ...JSON.parse(raw) };
    }
  }catch(e){ /* fresh */ }

  if(!state.startDate){
    state.startDate = todayISO();
    await saveState();
  }
  if(!state.milestonesShown) state.milestonesShown = [];
  state.selectedDate = todayISO();
  const t = new Date();
  state.calMonth = { year: t.getFullYear(), month: t.getMonth() };
  state.weekPreviewMonday = getMondayOf(todayISO());
  state.calSelectedDay = todayISO();
}

async function saveState(){
  const persist = {
    startDate: state.startDate,
    logs: state.logs,
    milestonesShown: state.milestonesShown || [],
  };
  try{
    localStorage.setItem('brazada_state', JSON.stringify(persist));
  }catch(e){ console.error('save fail', e); }
}

/* ============================================================
   DATE HELPERS
============================================================ */
function todayISO(){
  const d = new Date();
  return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
}
function pad(n){ return String(n).padStart(2,'0'); }
function parseISO(s){
  const [y,m,d] = s.split('-').map(Number);
  return new Date(y, m-1, d);
}
function isoOf(d){
  return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
}
function dayOfWeekMonFirst(d){
  // returns 1..7 (Mon..Sun)
  const js = d.getDay(); // 0=Sun..6=Sat
  return js === 0 ? 7 : js;
}

/**
 * Configuration: which weekdays are "rest" (no swim) per plan-week.
 * Plan weeks 1-3 have rest days to ease back into swimming after a long break.
 * Index is the plan week number (1-indexed). Each value is an array of
 * day-of-week numbers (1=Mon..5=Fri) that are rest days that week.
 * Saturdays/Sundays are never rest days in this config — they are the long sessions.
 */
const REST_DAYS_BY_WEEK = {
  1: [3, 5],   // Week 1: Wed and Fri are rest → swim Mon, Tue, Thu, plus Sat, Sun
  2: [3],      // Week 2: only Wed is rest → swim Mon, Tue, Thu, Fri, plus Sat, Sun
  3: [3],      // Week 3: only Wed is rest
  // Week 4+: no rest days, full 7-day plan
};

function isRestDay(iso){
  const week = weekNumber(iso);
  const dow = dayOfWeekMonFirst(parseISO(iso));
  const restDays = REST_DAYS_BY_WEEK[week];
  if(!restDays) return false;
  return restDays.includes(dow);
}

/**
 * Returns the long-session distances for a given week.
 * Phase 1 (weeks 1-3): softer Sat/Sun (900 m).
 * Week 4+: full distance (1.200 m).
 */
function getLongSessionTotal(week){
  return week <= 3 ? 900 : 1200;
}

/**
 * Color identifier per session type. Used as a 4px left border on cards
 * to give visual identity at a glance — like MySwimPro / Strong workout cards.
 */
const SESSION_COLORS = {
  1: 'var(--foam)',    // Lunes — Técnica + suave (didáctico)
  2: 'var(--coral)',   // Martes — Series cortas (intensidad)
  3: 'var(--water)',   // Miércoles — Espalda y postura (reparación)
  4: 'var(--abyss)',   // Jueves — Pull / brazos (fuerza)
  5: 'var(--gold)',    // Viernes — Patada / piernas (movimiento)
  6: 'var(--tide)',    // Sábado — Aeróbico continuo (calma sostenida)
  7: 'var(--tide)',    // Domingo — Sesión variada
};
function getSessionColor(idx){
  return SESSION_COLORS[idx] || 'var(--muted)';
}

/**
 * Returns which session corresponds to a given date.
 *
 * NEW LOGIC (continuous queue):
 * - Saturdays and Sundays are FIXED: always sessions 6 and 7 respectively
 *   (with phase-1 distance softening for weeks 1-3).
 * - Weekdays (Mon-Fri, excluding rest days) form a CONTINUOUS queue of
 *   short sessions: 1 → 2 → 3 → 4 → 5 → 1 → 2 → 3 ... It NEVER resets.
 * - Past weekday completed → consumes one position from the queue.
 * - Past weekday missed/skipped → does NOT consume, the session "waits"
 *   for the next swimmable weekday (even into the following week).
 * - Today and future weekdays are simulated as completed when computing
 *   what session a future date will show, so the calendar can answer
 *   "what session would I do on June 12?" deterministically.
 */
function getSessionForDate(iso){
  // Rest day: never any session.
  if(isRestDay(iso)){
    return { sessionIdx: null, session: null, isRest: true };
  }

  const d = parseISO(iso);
  const dow = dayOfWeekMonFirst(d);
  const week = weekNumber(iso);

  // Weekends are fixed: their own long session, with phase-1 distance softening.
  // Saturday is always session 6, Sunday is always session 7.
  if(dow === 6 || dow === 7){
    const baseSession = PLAN.sessions[dow];
    if(week <= 3){
      return {
        sessionIdx: dow,
        session: scaleLongSession(baseSession, 900),
        isRest: false
      };
    }
    return { sessionIdx: dow, session: baseSession, isRest: false };
  }

  // ---------- WEEKDAY: continuous queue ----------
  // Queue position = number of weekdays (Mon-Fri, non-rest, non-weekend)
  // strictly between startDate and the target date that have been "consumed".
  // Past consumed if marked done. Today/future days strictly before target
  // are assumed consumed (so the future is projected).
  const todayIso = todayISO();
  const startD = parseISO(state.startDate);
  let queuePos = 0;

  const cursor = new Date(startD);
  const targetTime = d.getTime();
  while(cursor.getTime() < targetTime){
    const cIso = isoOf(cursor);
    const cDow = dayOfWeekMonFirst(cursor);

    // Skip weekends and rest days — they don't touch the weekday queue.
    if(cDow >= 6 || isRestDay(cIso)){
      cursor.setDate(cursor.getDate() + 1);
      continue;
    }

    const isPast = cIso < todayIso;
    const log = state.logs[cIso];

    if(isPast){
      // Past weekday: only consume if it was done.
      if(log && log.done) queuePos++;
    } else {
      // Today or future weekday strictly before target: assume completion.
      queuePos++;
    }

    cursor.setDate(cursor.getDate() + 1);
  }

  // Map queue position to session index 1..5 (cycling).
  // queuePos=0 → session 1, queuePos=5 → session 1 again, etc.
  const idx = (queuePos % 5) + 1;
  return { sessionIdx: idx, session: PLAN.sessions[idx], isRest: false };
}

/**
 * Returns a scaled version of a long session with a different total distance.
 * Proportionally reduces each block's distance.
 */
function scaleLongSession(session, newTotal){
  const ratio = newTotal / session.total;
  // Round to nearest 50m for clean numbers
  const round50 = (n) => Math.round(n / 50) * 50;
  const scaledBlocks = session.blocks.map(b => ({
    ...b,
    dist: round50(b.dist * ratio)
  }));
  // Adjust last block to make the total exactly match newTotal
  const sumSoFar = scaledBlocks.slice(0,-1).reduce((s,b)=>s+b.dist, 0);
  scaledBlocks[scaledBlocks.length-1].dist = newTotal - sumSoFar;
  return {
    ...session,
    total: newTotal,
    blocks: scaledBlocks
  };
}
function daysBetween(a, b){
  const ms = parseISO(b) - parseISO(a);
  return Math.round(ms / 86400000);
}
function weekNumber(date){
  // weeks since startDate, 1-indexed
  const diff = daysBetween(state.startDate, date);
  return Math.floor(diff / 7) + 1;
}
function phaseFor(week){
  for(const p of PLAN.phases){
    if(p.weeks.includes(week)) return p.name;
  }
  return PLAN.phases[PLAN.phases.length-1].name; // beyond plan → Definición
}
function fmtDate(iso){
  const d = parseISO(iso);
  return DOW_FULL[d.getDay()] + ' ' + d.getDate() + ' de ' + MONTHS[d.getMonth()];
}
function fmtDateShort(iso){
  const d = parseISO(iso);
  return d.getDate() + ' ' + MONTHS[d.getMonth()].slice(0,3);
}

/* ============================================================
   STREAK & STATS
============================================================ */
function calcStreak(){
  // count consecutive completed days back from today (skipping doesn't break if in future,
  // but if past day not completed → streak ends)
  let streak = 0;
  let cursor = new Date();
  // start from today; if today not done, start from yesterday
  const t = todayISO();
  if(!isDone(t)){
    cursor.setDate(cursor.getDate() - 1);
  }
  while(true){
    const iso = isoOf(cursor);
    if(parseISO(iso) < parseISO(state.startDate)) break;
    if(isDone(iso)){
      streak++;
      cursor.setDate(cursor.getDate() - 1);
    } else {
      break;
    }
  }
  return streak;
}
function isDone(iso){
  return state.logs[iso] && state.logs[iso].done === true;
}
function totalDistance(){
  let sum = 0;
  for(const iso in state.logs){
    if(state.logs[iso].done) sum += (state.logs[iso].distance || 0);
  }
  return sum;
}
function sessionsCompleted(){
  return Object.values(state.logs).filter(l => l.done).length;
}
function weekDistance(weekStartISO){
  // sum 7 days starting at weekStartISO
  let sum = 0;
  const d = parseISO(weekStartISO);
  for(let i=0;i<7;i++){
    const iso = isoOf(d);
    if(state.logs[iso] && state.logs[iso].done){
      sum += state.logs[iso].distance || 0;
    }
    d.setDate(d.getDate()+1);
  }
  return sum;
}
function getMondayOf(iso){
  const d = parseISO(iso);
  const dow = d.getDay() || 7;
  d.setDate(d.getDate() - (dow - 1));
  return isoOf(d);
}

  state.activeTab = name;
  document.querySelectorAll('.tab').forEach(t=>{
    t.classList.toggle('active', t.dataset.tab === name);
  });
  render();
}

  }
});

  const session = sessionInfo.session;
  const week = weekNumber(iso);
  const phase = phaseFor(week);
  const log = state.logs[iso] || { blocksDone: [] };

  const monday = getMondayOf(iso);
  const mondayD = parseISO(monday);

    const dd = new Date(mondayD);
    dd.setDate(mondayD.getDate()+i);

    const restMark = isRestDay(ddIso);
    const cls = (ddIso===iso?' active':'') + (isDone(ddIso)?' done':'') + (restMark?' rest':'');

      icon = '🛌';

        </div>
        ${isRest ? `<svg class="rest-illustration" viewBox="0 0 240 120" xmlns="http://www.w3.org/2000/svg">
          <!-- Moon crescent (filled circle minus mask circle) -->
          <circle cx="180" cy="40" r="18" fill="none" stroke="currentColor" stroke-width="1.4" opacity="0.55"/>
          <circle cx="186" cy="36" r="14" fill="#3a6470" opacity="1"/>

          <circle cx="60" cy="28" r="1.2" fill="currentColor" opacity="0.6"/>
          <circle cx="100" cy="44" r="1" fill="currentColor" opacity="0.5"/>
          <circle cx="140" cy="22" r="1.4" fill="currentColor" opacity="0.7"/>
          <circle cx="40" cy="50" r="0.9" fill="currentColor" opacity="0.4"/>
          <!-- Calm water lines -->

          <path d="M 10 95 Q 40 91 70 95 T 130 95 T 190 95 T 230 95" stroke="currentColor" stroke-width="1.2" fill="none" opacity="0.4"/>
          <path d="M 10 110 Q 40 106 70 110 T 130 110 T 190 110 T 230 110" stroke="currentColor" stroke-width="1.2" fill="none" opacity="0.3"/>

  $content.innerHTML = html;

  // Wire interactions

    el.addEventListener('click', ()=>{
      state.selectedDate = el.dataset.iso;
      renderHoy();

  });
  document.querySelectorAll('.block').forEach(el=>{
    const blockIdx = parseInt(el.dataset.block);
    const blockIso = el.dataset.iso;
    const row = el.querySelector('.block-row');
    const checkBtn = el.querySelector('.check-btn');

    // Tap on the row → expand/collapse description
    row.addEventListener('click', (e)=>{
      // ignore if check button was the actual target
      if(e.target.closest('.check-btn')) return;
      el.classList.toggle('expanded');
    });

    // Tap on check → toggle done (in-place, no full re-render)
    checkBtn.addEventListener('click', async (e)=>{
      e.stopPropagation();
      await toggleBlockDone(blockIso, blockIdx, el);
    });
  });
  document.querySelectorAll('[data-action="complete"]').forEach(el=>{
    el.addEventListener('click', ()=>openCompleteModal(el.dataset.iso));
  });
  document.querySelectorAll('[data-action="skip"]').forEach(el=>{
    el.addEventListener('click', ()=>markSkipped(el.dataset.iso));
  });
}

async function toggleBlockDone(iso, idx, blockEl){
  if(!state.logs[iso]) state.logs[iso] = { blocksDone: [] };
  if(!state.logs[iso].blocksDone) state.logs[iso].blocksDone = [];
  const arr = state.logs[iso].blocksDone;
  const pos = arr.indexOf(idx);
  if(pos>=0) arr.splice(pos,1); else arr.push(idx);

  // In-place visual update (no full re-render)
  if(blockEl){
    blockEl.classList.toggle('done', arr.includes(idx));
  }
  // Update counter
  const session = getSessionForDate(iso).session;
  const counter = document.getElementById('blocksCounter');
  if(counter && session){
    counter.textContent = `${arr.length}/${session.blocks.length}`;
    counter.style.color = arr.length === session.blocks.length ? 'var(--coral)' : 'var(--muted)';
  }

  // Save in background — don't await before visual feedback
  saveState();
}

async function markSkipped(iso){
  state.logs[iso] = { ...(state.logs[iso] || {}), done:false, skipped:true };
  await saveState();
  toast('Día marcado como no realizado');
  updateTabDots();
  renderHoy();
}

/* --------- MODAL: complete session --------- */
function openCompleteModal(iso){
  const session = getSessionForDate(iso).session;
  if(!session) return; // safety: shouldn't happen but guard anyway
  const existing = state.logs[iso] || {};
  const html = `
    <div class="modal-bg" id="modalBg">
      <div class="modal" onclick="event.stopPropagation()">
        <div class="modal-handle"></div>
        <h3>Registrar ${fmtDateShort(iso)}</h3>

        <div class="field">
          <label>Distancia real (m)</label>
          <input type="number" id="fDist" inputmode="numeric" placeholder="${session.total}" value="${existing.distance ?? ''}">
        </div>

        <div class="field">
          <label>¿Cómo te sentiste?</label>
          <div class="feel-row" id="feelRow">
            <button class="feel-btn ${existing.feel===1?'selected':''}" data-feel="1" title="Muy duro">😣</button>
            <button class="feel-btn ${existing.feel===2?'selected':''}" data-feel="2" title="Duro">😮‍💨</button>
            <button class="feel-btn ${existing.feel===3?'selected':''}" data-feel="3" title="OK">🙂</button>
            <button class="feel-btn ${existing.feel===4?'selected':''}" data-feel="4" title="Bien">😊</button>
            <button class="feel-btn ${existing.feel===5?'selected':''}" data-feel="5" title="Volando">🔥</button>
          </div>
        </div>

        <div class="field">
          <label>Notas (opcional)</label>
          <textarea id="fNotes" placeholder="Sensaciones, técnica, lo que quieras...">${existing.notes || ''}</textarea>
        </div>

        <div class="actions">
          <button class="btn btn-secondary" id="btnCancel">Cancelar</button>
          <button class="btn btn-primary" id="btnSave">Guardar</button>
        </div>
      </div>
    </div>
  `;
  document.getElementById('modalRoot').innerHTML = html;

  let pickedFeel = existing.feel || null;
  document.querySelectorAll('.feel-btn').forEach(b=>{
    b.addEventListener('click', ()=>{
      pickedFeel = parseInt(b.dataset.feel);
      document.querySelectorAll('.feel-btn').forEach(x=>x.classList.remove('selected'));
      b.classList.add('selected');
    });
  });
  document.getElementById('modalBg').addEventListener('click', closeModal);
  document.getElementById('btnCancel').addEventListener('click', closeModal);
  document.getElementById('btnSave').addEventListener('click', async ()=>{
    const distVal = parseInt(document.getElementById('fDist').value) || session.total;
    const notes = document.getElementById('fNotes').value.trim();
    const info = getSessionForDate(iso);
    const wasNotDone = !(state.logs[iso] && state.logs[iso].done);
    state.logs[iso] = {
      ...(state.logs[iso] || {}),
      done: true,
      skipped: false,
      distance: distVal,
      feel: pickedFeel,
      notes: notes,
      sessionIdx: info.sessionIdx,
      blocksDone: info.session.blocks.map((_,i)=>i)
    };
    await saveState();
    closeModal();
    // Only check milestones on first completion (avoid re-triggering on edit)
    if(wasNotDone){
      const milestone = checkMilestones();
      if(milestone){
        showMilestoneScreen(milestone);
      } else {
        toast('¡Sesión registrada! 🏊');
      }
    } else {
      toast('Sesión actualizada');
    }
    render();
  });
}
function closeModal(){ document.getElementById('modalRoot').innerHTML = ''; }

/* ============================================================
   MILESTONES
============================================================ */
const MILESTONES = [
  // ---- First-time milestones (priority order) ----
  { id: 'first_session', title: 'Primera sesión', subtitle: 'Has empezado tu vuelta al agua',
    check: () => sessionsCompleted() === 1 },
  { id: 'first_km', title: '1 km', subtitle: 'Tu primer kilómetro nadado',
    check: () => totalDistance() >= 1000 },
  { id: 'first_week', title: 'Semana completa', subtitle: 'Has completado tu primera semana',
    check: () => {
      // Count distinct ISO weeks in which all planned sessions were done
      const monIso = getMondayOf(state.startDate);
      const m = parseISO(monIso);
      let planned = 0, done = 0;
      for(let i = 0; i < 7; i++){
        const d = new Date(m); d.setDate(m.getDate() + i);
        const iso = isoOf(d);
        const info = getSessionForDate(iso);
        if(info.session){
          planned++;
          const log = state.logs[iso];
          if(log && log.done) done++;
        }
      }
      return planned > 0 && done >= planned;
    }},
  // ---- Distance milestones ----
  { id: 'km_5', title: '5 km totales', subtitle: 'Vas cogiendo el ritmo',
    check: () => totalDistance() >= 5000 },
  { id: 'km_10', title: '10 km totales', subtitle: 'Tu cuerpo ya recuerda',
    check: () => totalDistance() >= 10000 },
  { id: 'km_25', title: '25 km totales', subtitle: 'Esto es constancia',
    check: () => totalDistance() >= 25000 },
  { id: 'km_50', title: '50 km totales', subtitle: 'Medio centenar bajo el agua',
    check: () => totalDistance() >= 50000 },
  { id: 'km_100', title: '100 km totales', subtitle: 'Eres un nadador',
    check: () => totalDistance() >= 100000 },
  // ---- Phase completion ----
  { id: 'phase_adapt', title: 'Adaptación completada', subtitle: 'Ya estás listo para más', sub2: 'Avanzas a Técnica',
    check: () => weekNumber(todayISO()) > 3 && sessionsCompleted() >= 6 },
  { id: 'phase_tecnica', title: 'Técnica completada', subtitle: 'Tu brazada ya tiene forma', sub2: 'Avanzas a Volumen',
    check: () => weekNumber(todayISO()) > 6 && sessionsCompleted() >= 18 },
  { id: 'phase_volumen', title: 'Volumen completado', subtitle: 'Tu resistencia es real', sub2: 'Avanzas a Definición',
    check: () => weekNumber(todayISO()) > 10 && sessionsCompleted() >= 36 },
  { id: 'phase_def', title: 'Plan completado', subtitle: '12 semanas. Lo conseguiste.', sub2: 'Has cerrado el plan',
    check: () => weekNumber(todayISO()) > 12 && sessionsCompleted() >= 50 },
  // ---- Streak milestones ----
  { id: 'streak_7', title: 'Racha de 7 días', subtitle: 'Una semana sin saltarte',
    check: () => calcStreak() >= 7 },
  { id: 'streak_14', title: 'Racha de 14 días', subtitle: 'Dos semanas perfectas',
    check: () => calcStreak() >= 14 },
  { id: 'streak_30', title: 'Racha de 30 días', subtitle: 'Un mes ininterrumpido',
    check: () => calcStreak() >= 30 },
];

/**
 * Returns the next unlocked-but-not-shown milestone, or null.
 * Marks it as shown and saves state.
 */
function checkMilestones(){
  if(!state.milestonesShown) state.milestonesShown = [];
  for(const m of MILESTONES){
    if(state.milestonesShown.includes(m.id)) continue;
    try{
      if(m.check()){
        state.milestonesShown.push(m.id);
        saveState();
        return m;
      }
    } catch(e){ /* defensive */ }
  }
  return null;
}

/* --------- TAB: SEMANA (calendar) --------- */
function renderSemana(){
  const cm = state.calMonth;
  const first = new Date(cm.year, cm.month, 1);
  const startOffset = (first.getDay() || 7) - 1; // Mon=0
  const lastDay = new Date(cm.year, cm.month+1, 0).getDate();
  const todayIso = todayISO();
  const selected = state.calSelectedDay || todayIso;

  let cells = '';
  const dows = ['L','M','X','J','V','S','D'];
  dows.forEach(d=> cells += `<div class="cal-dow">${d}</div>`);
  for(let i=0;i<startOffset;i++) cells += `<div class="cal-day empty"></div>`;
  for(let day=1; day<=lastDay; day++){
    const dIso = cm.year+'-'+pad(cm.month+1)+'-'+pad(day);
    const isToday = dIso === todayIso;
    const isFuture = parseISO(dIso) > parseISO(todayIso);
    const isSelected = dIso === selected;
    const log = state.logs[dIso];
    const cls = ['cal-day'];
    if(isFuture) cls.push('future');
    if(isToday) cls.push('today');
    if(log && log.done) cls.push('done');
    if(log && log.skipped && !log.done) cls.push('skipped');
    if(isRestDay(dIso) && !(log && log.done)) cls.push('rest');
    if(isSelected) cls.push('selected');
    cells += `<div class="${cls.join(' ')}" data-iso="${dIso}">${day}</div>`;
  }

  let html = `<section class="section">
    <div class="calendar">
      <div class="cal-head">
        <div class="cal-title">${MONTHS[cm.month]} ${cm.year}</div>
        <div class="cal-nav">
          <button id="prevMo">‹</button>
          <button id="nextMo">›</button>
        </div>
      </div>
      <div class="cal-grid">${cells}</div>
      ${renderDayDetail(selected)}
    </div>
  </section>`;

  // Stats for the month
  let monthDist = 0, monthSess = 0;
  for(const iso in state.logs){
    const d = parseISO(iso);
    if(d.getFullYear()===cm.year && d.getMonth()===cm.month && state.logs[iso].done){
      monthSess++;
      monthDist += state.logs[iso].distance || 0;
    }
  }

  html += `<section class="section">
    <h3 class="section-title">Resumen del mes</h3>
    <div class="stat-grid">
      <div class="stat-card">
        <div class="stat-label">Sesiones</div>
        <div class="stat-value">${monthSess}</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Distancia</div>
        <div class="stat-value">${(monthDist/1000).toFixed(1)}<span class="unit">km</span></div>
      </div>
    </div>
  </section>`;

  $content.innerHTML = html;

  document.getElementById('prevMo').onclick = ()=>{
    cm.month--;
    if(cm.month<0){cm.month=11;cm.year--;}
    renderSemana();
  };
  document.getElementById('nextMo').onclick = ()=>{
    cm.month++;
    if(cm.month>11){cm.month=0;cm.year++;}
    renderSemana();
  };
  // Tap on a calendar day → select it (show detail below)
  document.querySelectorAll('.cal-day:not(.empty)').forEach(el=>{
    el.addEventListener('click', ()=>{
      state.calSelectedDay = el.dataset.iso;
      renderSemana();
    });
  });
  // CTA button: jump to "Hoy" with that date
  const ctaBtn = document.getElementById('ddCta');
  if(ctaBtn){
    ctaBtn.addEventListener('click', ()=>{
      state.selectedDate = ctaBtn.dataset.iso;
      setTab('hoy');
    });
  }
}

/**
 * Renders the inline detail card for a selected calendar day.
 */
function renderDayDetail(iso){
  const d = parseISO(iso);
  const todayIso = todayISO();
  const isToday = iso === todayIso;
  const isPast = parseISO(iso) < parseISO(todayIso);
  const isFuture = parseISO(iso) > parseISO(todayIso);
  const log = state.logs[iso] || {};
  const sessionInfo = getSessionForDate(iso);
  const session = sessionInfo.session;
  const isRest = sessionInfo.isRest;
  const week = weekNumber(iso);
  const phase = phaseFor(week);

  // Date label
  const dateLabel = `${DOW_FULL[d.getDay()]} ${d.getDate()} de ${MONTHS[d.getMonth()]}`;
  let context;
  if(isToday) context = `Hoy · sem ${week} · ${phase}`;
  else if(isPast) context = `Sem ${week} · ${phase}`;
  else context = `Próximamente · sem ${week} · ${phase}`;

  // Status pill
  let statusPill = '';
  if(log.done) statusPill = '<div class="dd-status done">✓ Hecha</div>';
  else if(log.skipped) statusPill = '<div class="dd-status skipped">No realizada</div>';
  else if(isRest) statusPill = '<div class="dd-status rest-pill">Descanso</div>';

  let cardCls = 'day-detail';
  if(isToday && !isRest) cardCls += ' today';
  if(isRest) cardCls += ' rest-day';

  // Color stripe (only for non-today, non-rest sessions — adds visual identity)
  const showStripe = session && !isToday && !isRest;
  const stripeColor = session ? getSessionColor(sessionInfo.sessionIdx) : null;
  const stripeHTML = showStripe ? `<div class="dd-stripe" style="background:${stripeColor};"></div>` : '';

  // Build inner content
  let inner = stripeHTML + `<div class="dd-head">
      <div>
        <div class="dd-date">${dateLabel}</div>
        <div class="dd-context">${context}</div>
      </div>
      ${statusPill}
    </div>`;

  if(isRest){
    inner += `<div class="dd-rest-explain">
      <p style="margin-bottom:8px;">🛌 <strong>Día de descanso programado.</strong></p>
      <p>${week <= 3
        ? 'En las primeras 3 semanas, los días de descanso protegen tus tendones del manguito rotador mientras tu cuerpo se reacostumbra al agua.'
        : 'Día libre — disfruta.'}</p>
    </div>`;
  } else if(session){
    const blocksHTML = session.blocks.map(b =>
      `<div class="dd-block-row">
        <span class="dd-block-name">${b.name}</span>
        <span class="dd-block-dist">${b.dist} m</span>
      </div>`
    ).join('');

    const nameParts = session.name.split(' ');
    const firstWord = nameParts[0];
    const rest = nameParts.slice(1).join(' ');

    inner += `<div class="dd-session-name">${firstWord}${rest ? ` <em>${rest}</em>` : ''}</div>
      <div class="dd-stroke">${session.stroke}</div>
      <div class="dd-stats">
        <div class="dd-stat"><div class="v">${session.total}<span style="font-size:12px;opacity:0.7;"> m</span></div><div class="l">Distancia</div></div>
        <div class="dd-stat"><div class="v">${session.blocks.length}</div><div class="l">Bloques</div></div>
        ${log.done && log.distance ? `<div class="dd-stat"><div class="v" style="color:var(--coral);">${log.distance}<span style="font-size:12px;opacity:0.7;"> m</span></div><div class="l">Real</div></div>` : ''}
      </div>
      <div class="dd-blocks">${blocksHTML}</div>
      ${log.notes ? `<div class="dd-notes">"${escapeHtml(log.notes)}"</div>` : ''}
      ${(isToday || isFuture) && !log.done ? `<button class="dd-cta" id="ddCta" data-iso="${iso}">${isToday ? 'Ir a la sesión' : 'Ver detalle completo'}</button>` : ''}
      ${isPast && !log.done && !log.skipped ? `<button class="dd-cta" id="ddCta" data-iso="${iso}">Registrar este día</button>` : ''}`;
  } else {
    inner += `<div class="dd-rest-explain"><p>Sin sesión planificada para este día.</p></div>`;
  }

  return `<div class="${cardCls}">${inner}</div>`;
}

/* --------- TAB: HISTORIAL --------- */
function renderHistorial(){
  const entries = Object.entries(state.logs)

    .sort((a,b)=> b[0].localeCompare(a[0]));

  let html = `<section class="section">
    <h3 class="section-title">Tus sesiones</h3>`;

  if(entries.length === 0){
    html += `<div class="log-list"><div class="log-empty">

    entries.forEach(([iso, log])=>{
      const d = parseISO(iso);
      // Use stored sessionIdx (what was actually done) with fallback to day-of-week
      const sIdx = log.sessionIdx || dayOfWeekMonFirst(d);
      const session = PLAN.sessions[sIdx] || PLAN.sessions[dayOfWeekMonFirst(d)];
      const stripeColor = getSessionColor(sIdx);

          </div>

      } else {
        html += `<div class="log-item" style="--stripe-color:${stripeColor};">
          <div class="log-row">
            <div class="log-date">${fmtDateShort(iso)}</div>
